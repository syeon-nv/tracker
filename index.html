        '<div class="settings-row-head goal-step-header">' +
        (isEditing
          ? '<input type="text" class="settings-title-input" data-role="goal-step-title-input" data-id="' + s.id + '" value="' + escapeHtml(s.title) + '">'
          : '<div class="settings-row-title">' + escapeHtml(s.title || tr("제목 없는 도전")) + "</div>") +
        '<div class="task-manager-actions">' +
        (isEditing
          ? '<button type="button" class="icon-btn" data-action="save-goal-step" data-id="' + s.id + "\" aria-label=\"" + tr("저장") + "\">" + ICON_CHECK_LINE + '</button>'
          : '<button type="button" class="icon-btn" data-action="edit-goal-step" data-id="' + s.id + "\" aria-label=\"" + tr("수정") + "\">" + ICON_PENCIL_LINE + '</button>') +
        '<button type="button" class="icon-btn icon-btn-danger" data-action="delete-goal-step" data-id="' + s.id + "\" aria-label=\"" + tr("삭제") + "\">" + ICON_TRASH_LINE + '</button>' +
        "</div>" +
        "</div>"
      );
    }
    function renderGoalStepEntryRowHtml(stepId, en, i) {
      var isEditing = editingGoalStepEntryId === en.id;
      var dragHandleHtml = isEditing
        ? ""
        : "<span class=\"icon-btn goal-step-entry-drag-handle\" draggable=\"true\" title=\"" + tr("드래그해서 순서 변경") + "\" aria-hidden=\"true\">" + ICON_GRIP + "</span>";
      var actionsHtml =
        '<div class="task-manager-actions">' +
        (isEditing
          ? '<button type="button" class="icon-btn" data-action="save-goal-step-entry" data-step-id="' + stepId + '" data-id="' + en.id + "\" aria-label=\"" + tr("저장") + "\">" + ICON_CHECK_LINE + '</button>'
          : '<button type="button" class="icon-btn" data-action="edit-goal-step-entry" data-step-id="' + stepId + '" data-id="' + en.id + "\" aria-label=\"" + tr("수정") + "\">" + ICON_PENCIL_LINE + '</button>') +
        '<button type="button" class="icon-btn icon-btn-danger" data-action="delete-goal-step-entry" data-step-id="' + stepId + '" data-id="' + en.id + "\" aria-label=\"" + tr("삭제") + "\">" + ICON_TRASH_LINE + '</button>' +
        dragHandleHtml +
        "</div>";
      var rowCls = "goal-step-entry-row" + (draggedGoalStepEntryId === en.id ? " dragging" : "");
      // 편집 중이거나 제목이 없는 항목은 번호를 본문 옆에 그대로 두고, 제목이 있는 항목은
      // 번호와 제목을 같은 줄에 놓고 수직 중앙 정렬해서 번호가 제목과 정확히 맞도록 한다.
      if (isEditing) {
        return (
          '<div class="' + rowCls + '" data-id="' + en.id + '" data-step-id="' + stepId + '">' +
          '<div class="goal-step-entry-head">' +
          '<div class="goal-step-entry-num">' + (i + 1) + ".</div>" +
          actionsHtml +
          "</div>" +
          '<input type="text" class="settings-title-input goal-step-entry-title-input" data-role="goal-step-entry-title-input" data-step-id="' + stepId + '" data-id="' + en.id + '" value="' + escapeHtml(en.title) + "\" placeholder=\"" + tr("제목") + '">' +
          '<textarea class="settings-desc-input" data-role="goal-step-entry-input" data-step-id="' + stepId + '" data-id="' + en.id + '">' + escapeHtml(en.text) + "</textarea>" +
          "</div>"
        );
      }
      if (en.title) {
        return (
          '<div class="' + rowCls + '" data-id="' + en.id + '" data-step-id="' + stepId + '">' +
          '<div class="goal-step-entry-head">' +
          '<div class="goal-step-entry-num">' + (i + 1) + ".</div>" +
          '<div class="goal-step-entry-title">' + escapeHtml(en.title) + "</div>" +
          actionsHtml +
          "</div>" +
          '<div class="settings-row-desc md-body goal-step-entry-content-indent">' + renderMarkdownToHtml(en.text) + "</div>" +
          "</div>"
        );
      }
      return (
        '<div class="' + rowCls + '" data-id="' + en.id + '" data-step-id="' + stepId + '">' +
        '<div class="goal-step-entry-head">' +
        '<div class="goal-step-entry-num">' + (i + 1) + ".</div>" +
        actionsHtml +
        "</div>" +
        '<div class="settings-row-desc md-body goal-step-entry-content-indent">' + renderMarkdownToHtml(en.text) + "</div>" +
        "</div>"
      );
    }
    var goalStepTabsHtml = renderGoalStepTabsHtml(true);
    var goalStepActiveIdx = activeGoalStepIndex();
    var goalStepActive = state.goalSteps[goalStepActiveIdx];
    var activeEntries = goalStepActive && Array.isArray(goalStepActive.entries) ? goalStepActive.entries : [];
    var activeContentHtml = goalStepActive
      ? (renderGoalStepHeaderHtml(goalStepActive) +
         '<div class="goal-step-entries-list">' +
         (activeEntries.length
           ? activeEntries.map(function (en, ei) { return renderGoalStepEntryRowHtml(goalStepActive.id, en, ei); }).join("")
           : ("<p class=\"task-empty-hint\">" + tr("이 도전에 등록된 내용이 없어요. 아래에서 추가해보세요.") + "</p>")) +
         "</div>")
      : "";
    return (
      '<section class="card settings-card">' +
      '<div class="card-head"><h3>' + titleBar() + tr("나의 도전") + "</h3></div>" +
      goalStepTabsHtml +
      (state.goalSteps.length >= MAX_GOAL_STEPS && !addingNewGoalStep
        ? ("<p class=\"task-empty-hint\">" + tr("도전은 최대 6개까지 추가할 수 있어요.") + "</p>")
        : "") +
      '<div class="task-manager-list">' + (activeContentHtml || "<p class=\"task-empty-hint\">" + tr("등록된 도전이 없어요. 탭 옆의 + 버튼으로 추가해보세요.") + "</p>") + "</div>" +
      (goalStepActive
        ? ('<div class="settings-add-form">' +
           "<input type=\"text\" class=\"task-add-input\" data-role=\"goal-step-entry-add-title\" placeholder=\"" + tr("항목 제목 (선택)") + "\">" +
           "<textarea class=\"settings-desc-input\" data-role=\"goal-step-entry-add-body\" placeholder=\"" + tr("내용") + "\"></textarea>" +
           "<button type=\"button\" class=\"btn-add\" data-action=\"add-goal-step-entry\">+ " + tr("추가") + "</button>" +
           "</div>")
        : "") +
      "</section>"
    );
  }

  function renderPortfolioNotesManagerCard() {
    var linkLabelHtml = editingPortfolioLinkLabel
      ? ('<input type="text" class="settings-headline-input" data-role="portfolio-link-label-input" value="' + escapeHtml(state.portfolioLinkLabel) + "\" placeholder=\"" + tr("예: myportfolio.com") + "\">" +
         "<button type=\"button\" class=\"icon-btn\" data-action=\"save-portfolio-link-label\" aria-label=\"" + tr("저장") + "\">" + ICON_CHECK_LINE + '</button>')
      : ('<div class="settings-headline-text">' +
         (state.portfolioLinkLabel
           ? escapeHtml(state.portfolioLinkLabel)
           : "<span class=\"task-empty-hint\" style=\"padding:0;\">" + tr("포트폴리오 링크가 없어요.") + "</span>") +
         "</div>" +
         "<button type=\"button\" class=\"icon-btn\" data-action=\"edit-portfolio-link-label\" aria-label=\"" + tr("수정") + "\">" + ICON_PENCIL_LINE + '</button>');
    var rowsHtml = state.portfolioNotes.map(function (n) {
      var isEditing = editingPortfolioNoteId === n.id;
      return (
        '<div class="task-manager-row settings-row">' +
        '<div class="settings-row-head">' +
        (isEditing
          ? '<input type="text" class="settings-title-input" data-role="portfolio-note-title-input" data-id="' + n.id + '" value="' + escapeHtml(n.title) + '">'
          : '<div class="settings-row-title">' + escapeHtml(n.title) + "</div>") +
        '<div class="task-manager-actions">' +
        (isEditing
          ? '<button type="button" class="icon-btn" data-action="save-portfolio-note" data-id="' + n.id + "\" aria-label=\"" + tr("저장") + "\">" + ICON_CHECK_LINE + '</button>'
          : '<button type="button" class="icon-btn" data-action="edit-portfolio-note" data-id="' + n.id + "\" aria-label=\"" + tr("수정") + "\">" + ICON_PENCIL_LINE + '</button>') +
        '<button type="button" class="icon-btn icon-btn-danger" data-action="delete-portfolio-note" data-id="' + n.id + "\" aria-label=\"" + tr("삭제") + "\">" + ICON_TRASH_LINE + '</button>' +
        "</div>" +
        "</div>" +
        (isEditing
          ? '<textarea class="settings-desc-input" data-role="portfolio-note-body-input" data-id="' + n.id + '">' + escapeHtml(n.body) + "</textarea>"
          : '<div class="settings-row-desc md-body">' + renderMarkdownToHtml(n.body) + "</div>") +
        "</div>"
      );
    }).join("");
    return (
      '<section class="card settings-card">' +
      '<div class="card-head"><h3>' + titleBar() + tr("포트폴리오 분석 노트") + "</h3></div>" +
      '<div class="settings-headline-row">' + linkLabelHtml + "</div>" +
      '<div class="task-manager-list">' + (rowsHtml || "<p class=\"task-empty-hint\">" + tr("등록된 분석 노트가 없어요.") + "</p>") + "</div>" +
      '<div class="settings-add-form">' +
      "<input type=\"text\" class=\"task-add-input\" data-role=\"portfolio-note-add-title\" placeholder=\"" + tr("예: 새 항목 제목") + "\">" +
      "<textarea class=\"settings-desc-input\" data-role=\"portfolio-note-add-body\" placeholder=\"" + tr("내용") + "\"></textarea>" +
      "<button type=\"button\" class=\"btn-add\" data-action=\"add-portfolio-note\">+ " + tr("추가") + "</button>" +
      "</div>" +
      "</section>"

  }

  // 설정 탭 안에서 카드를 드래그로 재배치할 수 있게 감싸는 래퍼.
  function settingsCardWrapHtml(cardId, tabId, inner) {
    if (!inner) return "";
    var isDragging = draggedSettingsCardId === cardId && draggedSettingsCardTab === tabId;
    var dragIconHtml = "<span class=\"settings-card-drag-strip\" draggable=\"true\" title=\"" + tr("드래그해서 순서 변경") + "\" aria-hidden=\"true\">" + ICON_GRIP + "</span>";
    var innerWithHandle = inner.replace(/<\/h3>/, dragIconHtml + "</h3>");
    return (
      '<div class="settings-card-wrap' + (isDragging ? " dragging" : "") + '" data-settings-card-id="' + cardId + '" data-settings-card-tab="' + tabId + '">' +
      innerWithHandle +
      "</div>"
    );
  }

  // 데스크톱 앱(Electron)에서만 쓸 수 있는 "시작프로그램 자동 실행" 토글.
  // OS에 실제로 등록된 현재 값을 매 렌더링마다 그대로 읽어오므로, 윈도우
  // 설정에서 사용자가 직접 껐다 켰다 해도 항상 최신 상태를 보여준다.
  // 브라우저 등 이 API가 없는 환경에서는 꺼진 채 비활성화 상태로 안내만 보여준다.
  function renderAppPrefsCard() {
    var hasApi = !!(window.autoLaunchAPI && typeof window.autoLaunchAPI.getSync === "function");
    var enabled = hasApi ? !!window.autoLaunchAPI.getSync() : false;
    return (
      '<div class="card settings-app-prefs-card settings-rows-card">' +
      '<div class="card-head"><h3>' + titleBar() + tr("환경설정") + "</h3></div>" +
      '<div class="settings-toggle-row">' +
      '<div class="settings-toggle-row-text">' +
      '<div class="settings-toggle-row-label">' + tr("언어") + "</div>" +
      '<div class="settings-toggle-row-desc">' + tr("앱 전체에서 사용할 언어를 선택해요.") + "</div>" +
      "</div>" +
      '<button type="button" class="pill lang-toggle-btn" data-action="toggle-app-lang" title="' + tr("언어 전환") + '" aria-label="' + tr("언어 전환") + '">' +
      '<span class="lang-toggle-opt' + (APP_LANG === "ko" ? " active" : "") + '">KO</span>' +
      '<span class="lang-toggle-sep">/</span>' +
      '<span class="lang-toggle-opt' + (APP_LANG === "en" ? " active" : "") + '">EN</span>' +
      "</button>" +
      "</div>" +
      '<div class="settings-toggle-row">' +
      '<div class="settings-toggle-row-text">' +
      '<div class="settings-toggle-row-label">' + tr("컴퓨터 켤 때 자동 실행") + "</div>" +
      '<div class="settings-toggle-row-desc">' + tr("윈도우 로그인과 함께 앱이 자동으로 시작돼요.") + "</div>" +
      "</div>" +
      '<button type="button" class="toggle-switch' + (enabled ? " on" : "") + '" data-action="toggle-auto-launch" role="switch" aria-checked="' + (enabled ? "true" : "false") + '"' + (hasApi ? "" : " disabled") + ">" +
      '<span class="toggle-switch-thumb"></span>' +
      "</button>" +
      "</div>" +
      (hasApi ? "" : ('<p class="settings-toggle-row-hint">' + tr("데스크톱 앱에서만 사용할 수 있어요.") + "</p>")) +
      '<div class="settings-toggle-row settings-data-backup-row">' +
      '<div class="settings-toggle-row-text">' +
      '<div class="settings-toggle-row-label">' + tr("데이터 백업") + "</div>" +
      '<div class="settings-toggle-row-desc">' + tr("모든 데이터를 파일로 저장하거나 불러와요. 컴퓨터를 옮길 때 사용하세요.") + "</div>" +
      (dataBackupNotice ? ('<p class="settings-toggle-row-notice">' + escapeHtml(dataBackupNotice) + "</p>") : "") +
      "</div>" +
      '<div class="settings-data-backup-actions">' +
      '<button type="button" class="pill" data-action="export-data">' + tr("내보내기") + "</button>" +
      '<input type="file" id="data-import-input" class="file-input-hidden" accept="application/json" data-role="data-import-input">' +
      '<label for="data-import-input" class="pill">' + tr("가져오기") + "</label>" +
      "</div>" +
      "</div>" +
      (window.licenseAPI ? licenseSettingsRowHtml() : "") +
      '<div class="settings-toggle-row settings-version-row">' +
      '<div class="settings-toggle-row-text">' +
      '<div class="settings-toggle-row-label">' + tr("앱 버전") + "</div>" +
      versionCheckStatusHtml() +
      "</div>" +
      '<span class="settings-version-value">v' + escapeHtml(appVersionLabel()) + "</span>" +
      "</div>" +
      "</div>"
    );
  }

  // 리마인더는 윈도우(OS) 알림으로 뜨고, OS 알림 자체의 소리는 꺼둔 채(silent) 앱에서
  // 이 설정에 맞춰 알림음을 직접 재생한다. 켬/끔과 크기를 여기서 조절할 수 있다.
  function renderNotificationSoundCard() {
    var ns = normalizeNotificationSound(state.notificationSound);
    var pct = Math.round(ns.volume * 100);
    var customName = ns.customSound ? (ns.customSound.name || tr("사용자 지정 파일")) : "";
    return (
      '<div class="card settings-app-prefs-card settings-rows-card">' +
      '<div class="card-head"><h3>' + titleBar() + tr("알림음 설정") + "</h3></div>" +
      '<div class="settings-toggle-row">' +
      '<div class="settings-toggle-row-text">' +
      '<div class="settings-toggle-row-label">' + tr("리마인더 알림음") + "</div>" +
      '<div class="settings-toggle-row-desc">' + tr("리마인더 시간이 되면 윈도우 알림창이 뜨고 알림음이 함께 재생돼요.") + "</div>" +
      "</div>" +
      '<button type="button" class="toggle-switch' + (ns.enabled ? " on" : "") + '" data-action="toggle-notification-sound" role="switch" aria-checked="' + (ns.enabled ? "true" : "false") + '">' +
      '<span class="toggle-switch-thumb"></span>' +
      "</button>" +
      "</div>" +
      '<div class="settings-toggle-row' + (ns.enabled ? "" : " settings-row-disabled") + '">' +
      '<div class="settings-toggle-row-text">' +
      '<div class="settings-toggle-row-label">' + tr("알림음 크기") + "</div>" +
      '<div class="settings-toggle-row-desc">' + tr("앱이 재생하는 알림음의 크기를 조절해요.") + "</div>" +
      "</div>" +
      '<div class="settings-volume-control">' +
      '<input type="range" class="settings-volume-slider" data-role="notification-volume" min="0" max="100" step="5" value="' + pct + '"' + (ns.enabled ? "" : " disabled") + ">" +
      '<span class="settings-volume-value" data-role="notification-volume-value">' + pct + '%</span>' +
      '<button type="button" class="icon-btn" data-action="test-notification-sound" aria-label="' + tr("테스트 알림 보내기") + '" title="' + tr("테스트 알림 보내기") + '"' + (ns.enabled ? "" : " disabled") + ">" + ICON_BELL + "</button>" +
      "</div>" +
      "</div>" +
      '<div class="settings-toggle-row' + (ns.enabled ? "" : " settings-row-disabled") + '">' +
      '<div class="settings-toggle-row-text">' +
      '<div class="settings-toggle-row-label">' + tr("커스텀 알림음") + "</div>" +
      '<div class="settings-toggle-row-desc">' + (ns.customSound ? (tr("사용 중인 파일: ") + escapeHtml(customName)) : tr("기본 알림음 대신 원하는 소리 파일로 바꿀 수 있어요.")) + "</div>" +
      (customSoundNotice ? ('<div class="settings-toggle-row-notice">' + escapeHtml(customSoundNotice) + "</div>") : "") +
      "</div>" +
      '<div class="settings-volume-control">' +
      '<input type="file" id="custom-sound-file-input" class="file-input-hidden" accept="audio/*" data-role="custom-sound-file-input"' + (ns.enabled ? "" : " disabled") + ">" +
      '<label for="custom-sound-file-input" class="pill custom-sound-upload-btn' + (ns.enabled ? "" : " disabled") + '">' + tr("파일 선택") + "</label>" +
      (ns.customSound ? ("<button type=\"button\" class=\"icon-btn\" data-action=\"clear-custom-sound\" aria-label=\"" + tr("기본 알림음으로 되돌리기") + "\" title=\"" + tr("기본 알림음으로 되돌리기") + "\"" + (ns.enabled ? "" : " disabled") + ">" + ICON_X_LINE + "</button>") : "") +
      "</div>" +
      "</div>" +
      "</div>"
    );
  }

  // 트래커 페이지에 어떤 카드를 보여줄지 사용자가 체크박스로 직접 켜고 끌 수 있다.
  function renderTrackerCardVisibilityCard() {
    var visibility = normalizeMainCardVisibility(state.mainCardVisibility);
    var rowsHtml = MAIN_CARD_IDS.map(function (id) {
      var on = visibility[id] !== false;
      return (
        '<div class="settings-toggle-row">' +
        '<div class="settings-toggle-row-text">' +
        '<div class="settings-toggle-row-label">' + CARD_LABELS[id] + "</div>" +
        "</div>" +
        '<button type="button" class="toggle-switch' + (on ? " on" : "") + '" data-action="toggle-main-card-visibility" data-card-id="' + id + '" role="switch" aria-checked="' + (on ? "true" : "false") + '">' +
        '<span class="toggle-switch-thumb"></span>' +
        "</button>" +
        "</div>"
      );
    }).join("");
    return (
      '<div class="card settings-app-prefs-card">' +
      '<div class="card-head"><h3>' + titleBar() + tr("트래커 페이지 표시 항목") + "</h3></div>" +
      "<p class=\"task-manager-desc\">" + tr("트래커 페이지 표시 내용을 여기서 수정할 수 있어요.") + "</p>" +
      '<div class="settings-toggle-list">' + rowsHtml + "</div>" +
      "</div>"
    );
  }

  function renderSettingsChecklistTabContent() {
    var cardDefs = { daily: renderTaskManagerCard(), deadline: renderDeadlineManagerCard(), recurring: renderRecurringManagerCard() };
    var order = normalizeSettingsCardOrder(state.settingsCardOrder).checklist;
    return order.map(function (id) { return settingsCardWrapHtml(id, "checklist", cardDefs[id]); }).join("");
  }

  function renderSettingsPageContent() {
    var tabDefs = {
      checklist: { label: tr("체크리스트") },
      app: { label: tr("앱 설정") },
      focus: { label: tr("나의 목표") },
      portfolio: { label: tr("포트폴리오 · 도전") },
      display: { label: tr("트래커 페이지 표시") }
    };
    var tabOrder = normalizeSettingsTabOrder(state.settingsTabOrder);
    var tabsHtml = '<div class="settings-tabs">' +
      tabOrder.map(function (id) {
        var tab = tabDefs[id];
        if (!tab) return "";
        var cls = "settings-tab-btn" + (settingsActiveTab === id ? " active" : "") + (draggedSettingsTabId === id ? " dragging" : "");
        return '<button type="button" class="' + cls + '" draggable="true" data-action="settings-tab" data-tab="' + id + '">' +
          "<span class=\"row-drag-handle settings-tab-drag-handle\" draggable=\"true\" title=\"" + tr("드래그해서 순서 변경") + "\" aria-hidden=\"true\">" + ICON_GRIP + "</span>" +
          '<span>' + tab.label + "</span>" +
          "</button>";
      }).join("") +
      "</div>";
    var contentHtml;
    if (settingsActiveTab === "app") {
      contentHtml = renderAppPrefsCard() + renderNotificationSoundCard();
    } else if (settingsActiveTab === "focus") {
      contentHtml = '<div class="settings-goal-stack">' + renderMonthlyGoalCard() + renderWeekFocusManagerCard() + renderDailyGoalCard() + "</div>";
    } else if (settingsActiveTab === "portfolio") {
      var pCardDefs = { goal: renderGoalManagerCard(), notes: renderPortfolioNotesManagerCard() };
      var pOrder = normalizeSettingsCardOrder(state.settingsCardOrder).portfolio;
      contentHtml = '<div class="settings-grid">' + pOrder.map(function (id) { return settingsCardWrapHtml(id, "portfolio", pCardDefs[id]); }).join("") + '</div>';
    } else if (settingsActiveTab === "display") {
      contentHtml = renderTrackerCardVisibilityCard();
    } else {
      contentHtml = renderSettingsChecklistTabContent();
    }

  // 그려질 때 모두). CSS min-height는 유지하되, scrollHeight만큼 늘어나게 한다.
  function autoResizeTextarea(el) {
    if (!el || typeof el.scrollHeight !== "number") return;
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
  }
  function autoResizeAllTextareas() {
    var areas = document.querySelectorAll("textarea");
    for (var i = 0; i < areas.length; i++) autoResizeTextarea(areas[i]);
  }
  document.addEventListener("input", function (e) {
    if (e.target && e.target.tagName === "TEXTAREA") autoResizeTextarea(e.target);
  });

    var applyRender = function () {
      if (app) app.innerHTML = licenseGateShouldShow() ? renderLicenseGate() : renderBody();
      hideMdToolbar();

    };
    // 체크박스 하나 누를 때도 #app을 통째로 다시 그리다 보니(innerHTML 교체) 화면이

    // 포함)에서는 View Transitions API로 감싸서 교체 전/후 화면을 짧게 자연스럽게
    // 섞어준다 — 미지원 환경에서는 그냥 바로 반영(기존과 동일한 동작).
    if (typeof document.startViewTransition === "function") {
      try {
        document.startViewTransition(applyRender);

    }
    applyRender();
  }

  // Ctrl+V로 일기장 텍스트 영역에 이미지를 바로 붙여넣을 수 있도록, 클립보드
  // 붙여넣기 이벤트에서 이미지 데이터를 감지해 처리한다(클립보드 버튼 클릭과
  // 별개로, 키보드 붙여넣기도 동작해야 한다).
  document.addEventListener("paste", function (e) {
    if (currentPage !== "diary") return;
    var cd = e.clipboardData || (window.clipboardData);
    if (!cd || !cd.items) return;
    var imageItem = null;
    for (var i = 0; i < cd.items.length; i++) {
      if (cd.items[i].type && cd.items[i].type.indexOf("image/") === 0) {
        imageItem = cd.items[i];
        break;
      }
    }
    if (!imageItem) return;
    e.preventDefault();
    var file = imageItem.getAsFile();
    if (!file) return;
    var target = e.target;
    var diaryTextEl = target && target.closest ? target.closest('[data-role="diary-text"]') : null;
    var date = (diaryTextEl && diaryTextEl.dataset && diaryTextEl.dataset.date) || diarySelectedDate;
    readAndCompressImage(file, function (dataUrl) {
      if (!dataUrl) { setDiarySaveStatus(tr("이미지를 붙여넣지 못했어요")); return; }
      if (!state.diary[date]) state.diary[date] = { text: "", images: [] };
      if (!state.diary[date].images) state.diary[date].images = [];
      state.diary[date].images.push(dataUrl);
      render();
      saveState();
    });
  });

    // "change" 이벤트는 값이 실제로 바뀌었을 때만 발생하므로, 기본값(예: 09:00)을 그대로

      var title = titleEl ? titleEl.value.trim() : "";
      var text = textEl ? textEl.value.trim() : "";
      var s = state.goalSteps.find(function (x) { return x.id === stepId; });
      if (s && Array.isArray(s.entries)) {
        var en = s.entries.find(function (x) { return x.id === entryId; });
        if (en) { en.title = title; en.text = text; }
      }
      saveState();
    } catch (e) {}
    editingGoalStepEntryId = null;
    render();
  }
  function commitAddPortfolioNote() {
    try {
      var titleEl = document.querySelector('[data-role="portfolio-note-add-title"]');
      var bodyEl = document.querySelector('[data-role="portfolio-note-add-body"]');
      var title = titleEl ? titleEl.value.trim() : "";
      var body = bodyEl ? bodyEl.value.trim() : "";
      state.portfolioNotes.push({
        id: "note-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        title: title, body: body
      });
      if (titleEl) titleEl.value = "";
      if (bodyEl) bodyEl.value = "";
      saveState();
    } catch (e) {}
    render();
  }
  function commitPortfolioNoteEdit(id) {
    try {
      var titleEl = document.querySelector('[data-role="portfolio-note-title-input"][data-id="' + id + '"]');
      var bodyEl = document.querySelector('[data-role="portfolio-note-body-input"][data-id="' + id + '"]');
      var title = titleEl ? titleEl.value.trim() : "";
      var body = bodyEl ? bodyEl.value.trim() : "";
      if (title) {
        var n = state.portfolioNotes.find(function (x) { return x.id === id; });
        if (n) { n.title = title; n.body = body; }
        saveState();
      }
    } catch (e) {}
    editingPortfolioNoteId = null;
    render();
  }
  function upcomingDeadlines(maxDays) {
    var today = todayStr();
    var limitStr = null;
    var scanDays = typeof maxDays === "number" ? maxDays : 60;
    var limitDate = new Date(today + "T00:00:00");
    limitDate.setDate(limitDate.getDate() + scanDays);
    limitStr = todayStr(limitDate);
    // 규칙적인 일정(반복)은 마감 목록에서 빼고, 대신 "오늘의 일정" 카드에서 오늘 것만 보여준다.
    var out = state.deadlineItems
      .filter(function (t) { return t.dueDate && t.dueDate >= today && t.dueDate <= limitStr; });
    return out.sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
    });
  }
  // 앱을 켜자마자 한 번, OS(윈도우) 알림을 띄울 수 있는 권한을 요청해둔다.
  // 이미 허용/거부된 적이 있으면 브라우저/OS가 다시 묻지 않으므로 매번 불러도 안전하다.
  function ensureNotificationPermission() {
    try {
      // 데스크톱 앱(Electron)에서는 메인 프로세스가 알림을 직접 띄우므로(notifyAPI)
      // 렌더러 쪽 권한 요청이 필요 없다. 브라우저(미리보기)에서만 요청한다.
      if (window.notifyAPI) return;
      if (window.Notification && Notification.permission === "default") {
        Notification.requestPermission();
      }
    } catch (e) {}
  }
  ensureNotificationPermission();

  // 앱에서 설정한 크기(설정 > 앱 설정 > 알림음 설정)로 알림음을 재생한다.
  // 사용자가 커스텀 알림음(오디오 파일)을 지정해뒀으면 그걸 재생하고, 없으면
  // Web Audio로 만든 기본 종소리 톤을 재생한다.
  var reminderAudioCtx = null;
  function playReminderSound() {
    try {
      var ns = normalizeNotificationSound(state.notificationSound);
      if (!ns.enabled || ns.volume <= 0) return;
      if (ns.customSound && ns.customSound.dataUrl) {
        try {
          var customAudio = new Audio(ns.customSound.dataUrl);
          customAudio.volume = ns.volume;
          var playResult = customAudio.play();
          if (playResult && typeof playResult.catch === "function") playResult.catch(function () {});
          return;
        } catch (eCustom) {}
      }
      if (!reminderAudioCtx) {
        var Ctx = window.AudioContext || window.webkitAudioContext;
        if (!Ctx) return;
        reminderAudioCtx = new Ctx();
      }
      if (reminderAudioCtx.state === "suspended") { try { reminderAudioCtx.resume(); } catch (e0) {} }
      var ctx = reminderAudioCtx;
      var now = ctx.currentTime;
      // 두 개의 짧은 종소리 음(높은 음 → 살짝 낮은 음)을 이어서 울려 "딩동" 느낌을 낸다.
      [ { freq: 880, start: 0 }, { freq: 660, start: 0.16 } ].forEach(function (note) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = note.freq;
        var peak = 0.35 * ns.volume;
        var t0 = now + note.start;
        gain.gain.setValueAtTime(0.0001, t0);
        gain.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0001), t0 + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, t0 + 0.5);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start(t0);
        osc.stop(t0 + 0.55);
      });
    } catch (e) {}
  }

  // 리마인더 시간이 되면 실제 윈도우(OS) 알림(토스트)으로 띄운다. OS 알림 자체의
  // 소리는 꺼두고(silent), 대신 앱에서 설정한 크기로 알림음을 직접 재생한다.
  // 데스크톱 앱(Electron)에서는 렌더러의 web Notification API 대신 메인 프로세스에
  // IPC로 요청해서 띄운다 — 이쪽이 윈도우 액션 센터에 훨씬 안정적으로 나타난다
  // (렌더러 쪽 web Notification은 패키징된 앱에서 조용히 씹히는 경우가 있었음).
  // 브라우저(미리보기)에서 열었을 때만 web Notification API로 대신한다.
  function fireReminderNotification(labels) {
    try {
      var body = labels.length > 1 ? (tr("확인할 항목: ") + labels.join(", ")) : labels[0];
      if (window.notifyAPI && typeof window.notifyAPI.show === "function") {
        window.notifyAPI.show(tr("리마인더"), body);
      } else if (window.Notification && Notification.permission === "granted") {
        new Notification(tr("리마인더"), { body: body, silent: true });
      } else if (window.Notification && Notification.permission === "default") {
        Notification.requestPermission();
      }
    } catch (e) {}
    playReminderSound();
  }

  function checkReminders() {
    try {
      var now = new Date();
      var hhmm = pad(now.getHours()) + ":" + pad(now.getMinutes());
      var today = todayStr(now);
      var log = state.dailyLog[today] || {};
      var remaining = state.dailyTasks.filter(function (t) { return !log[t.id]; });
      var firedLabels = [];
      // 항목마다 자기만의 알림 시간(reminder)이 있으면 그 시간에만 알림을 주고,
      // 없는 항목은 기본 알림 시간(globalReminderTime)을 대신 따른다.
      remaining.forEach(function (t) {
        var effectiveTime = t.reminder || state.globalReminderTime;
        if (!effectiveTime || effectiveTime !== hhmm) return;
        var tkey = today + "|task|" + t.id;
        if (notifiedToday[tkey]) return;
        notifiedToday[tkey] = true;
        firedLabels.push(t.label);
      });
      // 규칙적인 일정에 지정해둔 알림 시간도 같은 방식으로 확인한다: 기간이 있으면 그
      // 기간 안에서만, 기간이 없으면 언제든 해당 요일에 알림을 준다.
      if (Array.isArray(state.recurringSchedules)) {
        var wd = now.getDay();
        state.recurringSchedules.forEach(function (s) {
          if (!s.reminderTime || s.reminderTime !== hhmm) return;
          if (s.startDate && today < s.startDate) return;
          if (s.endDate && today > s.endDate) return;
          var matchEntry = null;
          for (var i = 0; i < s.entries.length; i++) { if (s.entries[i].weekday === wd) { matchEntry = s.entries[i]; break; } }
          if (!matchEntry) return;
          var rkey = today + "|recur|" + s.id;
          if (notifiedToday[rkey]) return;
          notifiedToday[rkey] = true;
          firedLabels.push(matchEntry.label || tr("오늘의 일정"));
        });
      }
      if (!firedLabels.length) return;
      fireReminderNotification(firedLabels);
    } catch (e) {}
  }
  var lastKnownToday = todayStr();
  function checkDayRollover() {
    var t = todayStr();
    if (t !== lastKnownToday) {
      if (diarySelectedDate === lastKnownToday) diarySelectedDate = t;
      lastKnownToday = t;
      render();
    }
  }
  // 20초 간격이면 알림이 최대 20초까지 늦게 뜰 수 있어서(설정한 시간 vs 실제로
  // 뜨는 시간 사이 오차), 오차를 줄이기 위해 5초 간격으로 더 자주 확인한다.
  setInterval(function () { checkReminders(); checkDayRollover(); }, 5000);

  // 저장돼 있던 버전과 현재 빌드의 버전(APP_VERSION)을 비교해서, 값이 다르면
  // 새 버전으로 업데이트된 것으로 보고 안내 모달을 띄운다. 저장된 값이 아예
  // 없는 경우(최초 설치)는 업데이트가 아니므로 조용히 현재 버전만 기록한다.
  function checkAppVersionUpdate() {
    try {
      // 빌드 스크립트가 치환을 안 한 상태(로컬 개발용 원본 파일)면 버전 비교
      // 자체가 의미 없으므로 건너뛴다.
      if (APP_VERSION === APP_VERSION_PLACEHOLDER) return;
      var savedVersion = localStorage.getItem(APP_VERSION_STORAGE_KEY);
      if (savedVersion && savedVersion !== APP_VERSION) {
        // 여기서 바로 저장해버리면 사용자가 모달을 확인하지 않아도(예: 모달이
        // 뜨자마자 앱을 종료) 다음 실행부터 안내가 사라져버린다. 사용자가
        // 실제로 모달을 닫을 때(dismissNewVersionModal)만 저장해서, "확인을
        // 눌러야 다음부터 안 뜬다"는 동작을 보장한다.
        newVersionModalInfo = { from: savedVersion, to: APP_VERSION };
      } else if (!savedVersion) {
        // 최초 설치(비교 대상 자체가 없음)는 업데이트가 아니므로 안내 없이
        // 조용히 현재 버전만 기록한다.
        localStorage.setItem(APP_VERSION_STORAGE_KEY, APP_VERSION);
      }
    } catch (e) {}
  }

  // 새 버전 안내 모달을 닫을 때(확인 버튼, 오버레이 클릭, Esc 모두) 호출한다.
  // 이 시점에 버전을 기록해야 "확인을 눌러야 다음 실행부터 다시 안 뜬다"가
  // 지켜진다 — 감지 시점에 바로 기록해버리면 모달을 실제로 닫기 전에 앱을
  // 종료해도 다음부터 안내가 사라져버리기 때문이다.
  function dismissNewVersionModal() {
    if (!newVersionModalInfo) return;
    try { localStorage.setItem(APP_VERSION_STORAGE_KEY, APP_VERSION); } catch (e) {}
    newVersionModalInfo = null;
  }
  checkAppVersionUpdate();
  checkLatestVersionOnline();

  // 저장된 라이선스가 다른 기기에서 이미 해제됐는지 조용히 한 번 다시
  // 확인한다. 오프라인이거나 확인 자체가 실패하면 마지막으로 확인된 상태를
  // 그대로 믿고 계속 쓸 수 있게 둔다(인터넷 없을 때 앱을 못 쓰게 되는 걸
  // 막기 위함) — 오직 서버가 "이 기기는 등록 안 돼 있다"고 명확히 답할
  // 때만 다시 인증 화면을 띄운다.
  if (window.licenseAPI && licenseState) {
    window.licenseAPI.status(licenseState.key).then(function (res) {
      if (res && res.ok && !res.activated) {
        licenseState = null;
        saveLicenseState(null);
        render();
      }
    });
  }

  applyAccent();
  render();
})();
</script>
</body>
</html>
