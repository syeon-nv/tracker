<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tracker</title>
<style id="app-style">
  :root {
    /* height:auto 사이의 변화도 부드럽게 트랜지션되도록 허용한다(카드 크기가
       갑자기 덜컹이며 바뀌는 대신 자연스럽게 늘고 줄게 하기 위함). */
    interpolate-size: allow-keywords;
    /* 창 버튼(최소화/최대화/닫기) 오버레이의 실제 높이. 커스텀 타이틀바와
       그 아래 아이콘 메뉴가 항상 같은 값을 참조하도록 변수 하나로 통일해서,
       OS/배율에 따라 실제 오버레이 높이가 40px에서 살짝 어긋나더라도
       1px 틈이 생기지 않게 한다. */
    --titlebar-h: env(titlebar-area-height, 45px);
    --accent-gold: #B3B9CC;
    --accent-bg: var(--accent-gold);
    --paper: color-mix(in srgb, var(--accent-gold) 6%, #FFFFFF);
    --card: color-mix(in srgb, var(--accent-gold) 2%, #FFFFFF);
    --ink: #2B2620;
    --ink-muted: color-mix(in srgb, var(--accent-gold) 38%, #857A68);
    --grid-line: color-mix(in srgb, var(--accent-gold) 12%, transparent);
    --border: color-mix(in srgb, var(--accent-gold) 26%, #E4E0D8);
    --accent-gold-soft: color-mix(in srgb, var(--accent-gold) 35%, var(--card));
    --accent-gold-pale: color-mix(in srgb, var(--accent-gold) 14%, var(--card));
    --accent-text: color-mix(in srgb, var(--accent-gold) 55%, var(--ink) 45%);
    --accent-ink: #2B2620;
    --accent-ink-solid: #2B2620;
    --accent-gold-dark: color-mix(in srgb, var(--accent-gold) 55%, #000 45%);
    /* 체크 아이콘 색은 테마색을 채도까지 억지로 끌어올리지 않고, 그대로 어둡게만
       섞어서 실제 고른 테마색과 같은 색감으로 보이게 한다. */
    --check-ink: color-mix(in srgb, var(--accent-gold) 55%, #000 45%);
    --accent-blue: #3E6B8A;
    --success: #4C7A52;
    --locked-bg: color-mix(in srgb, var(--accent-gold) 48%, #F6F2EA);
    --locked-fg: color-mix(in srgb, var(--accent-gold) 62%, #7A756A);
    --shadow: 0 1px 2px rgba(43,38,32,0.05), 0 6px 16px rgba(43,38,32,0.06);
  }

  /* 일정 체크 등으로 상태가 바뀔 때마다 #app 전체를 다시 그리는데(innerHTML 교체),
     그러면 브라우저가 화면을 한 프레임에 통째로 바꿔서 덜컹거려 보인다. View
     Transitions API를 쓰면(아래 render()에서 document.startViewTransition으로 감쌈)
     교체 전/후 화면을 짧게 크로스페이드해줘서 훨씬 부드럽다. 애니메이션 길이만
     기본값(꽤 김)보다 짧게 줄여서 체크박스처럼 잦은 조작에도 굼뜨지 않게 한다. */
  ::view-transition-old(root),
  ::view-transition-new(root) {
    animation-duration: 0.15s;
    animation-timing-function: ease-out;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: color-mix(in srgb, var(--accent-gold) 10%, #10161D);
      --card: color-mix(in srgb, var(--accent-gold) 7%, #171F29);
      --ink: #E9EEF3;
      --ink-muted: color-mix(in srgb, var(--accent-gold) 36%, #8FA0AF);
      --grid-line: color-mix(in srgb, var(--accent-gold) 16%, transparent);
      --border: color-mix(in srgb, var(--accent-gold) 16%, #263243);
      --accent-gold-soft: color-mix(in srgb, var(--accent-gold) 30%, var(--card));
      --accent-gold-pale: color-mix(in srgb, var(--accent-gold) 12%, var(--card));
      --accent-text: color-mix(in srgb, var(--accent-gold) 55%, var(--ink) 45%);
      --accent-ink: #FAF3E7;
      --accent-ink-solid: #FAF3E7;
      --accent-gold-dark: color-mix(in srgb, var(--accent-gold) 55%, #000 45%);
      /* 어두운 배경 위에서 보여야 하므로 검정 대신 흰색 쪽으로 섞어서
         테마색과 같은 색감을 유지하면서도 또렷하게 보이게 한다. */
      --check-ink: color-mix(in srgb, var(--accent-gold) 55%, #fff 45%);
      --accent-blue: #6FA8D6;
      --success: #7FBE86;
      --locked-bg: color-mix(in srgb, var(--accent-gold) 26%, #1C2530);
      --locked-fg: color-mix(in srgb, var(--accent-gold) 50%, #5C6B7A);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    }
  }

  * { box-sizing: border-box; word-break: break-word !important; }

  html, body { height: 100%; }

  body {
    margin: 0;
    background-color: var(--paper);
    background-image:
      repeating-linear-gradient(0deg, var(--grid-line) 0 1px, transparent 1px 34px),
      repeating-linear-gradient(90deg, var(--grid-line) 0 1px, transparent 1px 34px);
    color: var(--ink);
    font-family: 'Malgun Gothic', -apple-system, BlinkMacSystemFont, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
    overflow-y: auto;
  }

  .app-titlebar {
    -webkit-app-region: drag;
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 9999;
    display: flex;
    align-items: center;
    gap: 8px;
    height: var(--titlebar-h);
    padding: 0 16px;
    background: var(--accent-bg);
    color: var(--ink);
    font-family: 'Malgun Gothic', sans-serif;
    font-size: 13px;
    font-weight: 700;
    -webkit-user-select: none;
    user-select: none;
    flex-shrink: 0;
  }
  #app { padding-top: var(--titlebar-h); }
  .app-titlebar-mark { width: 20px; height: 20px; flex-shrink: 0; }
  .app-titlebar-text { letter-spacing: 0.02em; }

  h1, h2, h3 { font-family: 'Malgun Gothic', cursive, sans-serif; margin: 0; }
  .title-icon { display: inline-flex; flex-shrink: 0; width: 24.5px; height: 24.5px; vertical-align: -6px; margin-right: 8px; color: var(--accent-text); }
  .title-icon svg { width: 100%; height: 100%; }
  .card-title-bar { display: inline-block; width: 5px; height: 30px; border-radius: 1px; background: var(--accent-gold); vertical-align: middle; margin-right: 8px; flex-shrink: 0; }

  .app-shell { display: flex; }
  .icon-nav {
    width: 64px;
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    padding: 20px 0;
    background: var(--card);
    border-right: 1px solid var(--border);
    position: sticky;
    top: var(--titlebar-h);
    align-self: flex-start;
    height: calc(100vh - var(--titlebar-h));
  }
  .icon-nav-btn {
    width: 44px;
    height: 44px;
    border-radius: 12px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
  }
  .icon-nav-btn svg { width: 22px; height: 22px; }
  .icon-nav-btn[data-nav-id="main"] svg { width: 25px; height: 25px; }
  .icon-nav-btn[data-nav-id="tasks"] svg,
  .icon-nav-btn[data-nav-id="portfolio"] svg { width: 19px; height: 19px; }
  .icon-nav-btn:hover { background: var(--grid-line); color: var(--ink); }
  .icon-nav-btn.active { background: var(--accent-gold); color: var(--accent-ink-solid); border-color: var(--accent-gold); }
  .icon-nav-btn[draggable="true"] { cursor: grab; }
  .icon-nav-btn.dragging { opacity: 0.35; cursor: grabbing; }
  .icon-nav-btn.drag-over { border-color: var(--accent-gold); background: var(--accent-gold); color: var(--accent-ink-solid); }
  @media (max-width: 700px) {
    .app-shell { flex-direction: column; }
    .icon-nav {
      width: 100%;
      height: auto;
      flex-direction: row;
      justify-content: center;
      padding: 10px 0;
      border-right: none;
      border-bottom: 1px solid var(--border);
      position: static;
    }
  }

  .wrap {
    flex: 1;
    min-width: 0;
    max-width: 1024px;
    margin: 0 auto;
    padding: 40px 20px 64px;
  }

  .main-col { display: flex; flex-direction: column; gap: 22px; min-width: 0; }

  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    flex-wrap: wrap;
    gap: 16px;
    -webkit-app-region: drag;
    position: static;
  }
  .topbar button, .topbar summary, .topbar input { -webkit-app-region: no-drag; }

  .brand { display: flex; align-items: center; gap: 12px; }
  .mark { width: 52px; height: 52px; color: var(--accent-gold); flex-shrink: 0; }
  .eyebrow {
    text-transform: uppercase;
    letter-spacing: 0.11em;
    font-size: 11px;
    color: var(--ink-muted);
    margin: 0 0 2px;
    font-weight: 600;
  }
  .brand h1 { font-size: 30px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
  .brand-edit-btn { opacity: 0.5; }
  .brand-edit-btn:hover { opacity: 1; }
  .brand-edit { display: flex; flex-direction: column; gap: 6px; }
  .brand-edit-input { font: inherit; border: 1px solid var(--accent-gold); border-radius: 8px; background: var(--paper); color: var(--ink); padding: 5px 9px; font-size: 12.5px; width: 220px; min-height: 35px; }
  .brand-edit-input-title { font-size: 18px; font-weight: 700; }

  .topbar-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

  .pill {
    height: 35px;
    padding: 0 16px;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 999px;
    box-shadow: none;
    font-size: 13px;
    font-weight: 600;
  }

  .lang-toggle-btn { cursor: pointer; color: var(--ink-muted); }
  .lang-toggle-btn:hover { border-color: var(--accent-gold); }
  .lang-toggle-opt { opacity: 0.45; transition: opacity 0.15s ease, color 0.15s ease; }
  .lang-toggle-opt.active { opacity: 1; color: var(--ink); }
  .lang-toggle-sep { opacity: 0.35; }

  .theme-picker { position: relative; }
  .theme-picker > summary { list-style: none; cursor: pointer; }
  .theme-picker > summary::-webkit-details-marker { display: none; }
  .theme-picker[open] > summary { border-color: var(--accent-gold); }
  .theme-panel {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px;
    box-shadow: var(--shadow);
    z-index: 10;
    width: 280px;
  }
  .theme-current-dot {
    display: inline-block;
    width: 14px;
    height: 14px;
    border-radius: 50%;
    border: 1px solid var(--border);
    vertical-align: -2px;
    margin-right: 3px;
    overflow: hidden;
    background-clip: padding-box;
  }
  .swatch-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .swatch {
    width: 28px;
    height: 28px;
    border-radius: 50%;
    border: 2px solid transparent;
    box-shadow: 0 0 0 1px var(--border);
    cursor: pointer;
    padding: 0;
    overflow: hidden;
    background-clip: padding-box;
  }
  .swatch.active { border-color: var(--ink); }
  .swatch-caption { font-size: 11px; color: var(--ink-muted); margin: 0 0 10px; line-height: 1.5; }
  .swatch-wrap { position: relative; display: inline-block; line-height: 0; }
  .swatch-delete-btn {
    position: absolute;
    top: -8px;
    right: -8px;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--ink);
    color: var(--card);
    border: 1px solid var(--card);
    font-size: 9px;
    line-height: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    padding: 0;
    opacity: 0;
    transform: scale(0.8);
    transition: opacity .12s, transform .12s;
  }
  .swatch-delete-btn svg { width: 9px; height: 9px; flex-shrink: 0;
  }
  .swatch-wrap:hover .swatch-delete-btn,
  .swatch-delete-btn:focus { opacity: 1; transform: scale(1); }
  .custom-controls {
    border-top: 1px solid var(--border);
    padding-top: 10px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .custom-color-row {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  .custom-color-label { flex-shrink: 0; white-space: nowrap; }
  .gradient-arrow { font-size: 11px; color: var(--ink-muted); flex-shrink: 0; display: inline-flex; }
  .gradient-arrow svg { width: 14px; height: 14px; }
  .gradient-color-drag { display: inline-flex; border-radius: 50%; cursor: grab; flex-shrink: 0; }
  .gradient-color-drag.dragging { opacity: 0.35; cursor: grabbing; }
  .gradient-color-drag.drag-over { outline: 2px dashed var(--accent-gold); outline-offset: 2px; }
  .custom-color-row input[type="color"] {
    -webkit-appearance: none;
    appearance: none;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    border-radius: 50%;
    padding: 0;
    margin: 0;
    background: none;
    cursor: pointer;
    overflow: hidden;
    flex-shrink: 0;
  }
  .custom-color-row input[type="color"]::-webkit-color-swatch-wrapper {
    padding: 0;
    margin: 0;
    border: none;
    border-radius: 50%;
    overflow: hidden;
  }
  .custom-color-row input[type="color"]::-webkit-color-swatch {
    border: none;
    border-radius: 50%;
    width: 100%;
    height: 100%;
  }
  .custom-color-add-btn { width: 26px; height: 26px; font-size: 15px; margin-left: auto; flex-shrink: 0; }

  .stats { display: flex; gap: 10px; flex-wrap: wrap; }
  .stat { align-items: center; }
  .stat-icon { font-size: 15px; display: inline-flex; color: var(--accent-gold); }
  .stat-icon svg { width: 18px; height: 18px; }
  .stat-value { font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; }
  .streak-stat .stat-value { color: var(--accent-text); }
  .stat-label { font-size: 12px; color: var(--ink-muted); }

  .week-strip { display: flex; gap: 6px; align-items: center; }
  .week-strip-label { font-size: 12px; color: var(--ink-muted); margin-right: 4px; }
  .daydot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border); background: var(--card); display: inline-block; }
  .daydot.partial { background: var(--accent-gold-soft); border-color: var(--accent-gold); }
  .daydot.full { background: var(--accent-gold); border-color: var(--accent-gold); }

  .focus-banner {
    position: relative;
    overflow: hidden;
    background: var(--accent-gold-soft);
    border: 1px solid var(--accent-gold);
    border-radius: 14px;
    padding: 20px 24px 20px 29px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 20px;
    flex-wrap: wrap;
  }
  .focus-banner::before {
    content: "";
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 5px;
    background: var(--accent-bg);
  }
  .focus-eyebrow {
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--accent-text);
    font-weight: 700;
    margin: 0 0 4px;
  }
  .focus-text { width: 100%; padding-left: 15px; }
  .focus-text h2 { font-size: 22px; margin-bottom: 6px; }
  .focus-desc { margin: 0; color: var(--ink); font-size: 14.5px; width: 100%; padding-left: 15px; }
  .focus-desc.md-body { padding-left: 0; }
  .focus-actions { display: flex; flex-direction: column; align-items: flex-end; gap: 10px; margin-left: auto; }
  .dots { display: flex; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--border); }
  .dot.active { background: var(--accent-gold); }
  .goal-tier-empty { font-weight: 700; color: var(--accent-text); }
  h2.goal-tier-empty { font-size: 22px; margin-bottom: 6px; }
  .goal-banner-solo { align-items: center; }
  .goal-step-title { font-size: 16px; margin: 12px 0 6px; }
  .goal-step-entry { display: flex; align-items: flex-start; gap: 8px; margin: 10px 0; }
  .goal-step-entry-num { font-weight: 700; font-size: 14.5px; color: var(--accent-text); flex-shrink: 0; min-width: 18px; }
  .goal-step-entry .md-body { flex: 1; min-width: 0; font-size: 13px; color: var(--ink-muted); }
  .goal-step-entry-row { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .goal-step-entry-body-wrap { flex: 1; min-width: 0; }
  .goal-step-header { margin-bottom: 4px; }
  .goal-step-entries-list { margin-top: 6px; }
  .goal-step-entry-title { font-weight: 700; font-size: 14.5px; margin: 0; line-height: 1.3; }
  .goal-step-entry-head { display: flex; align-items: center; gap: 8px; }
  .goal-step-entry-head .goal-step-entry-num { margin-top: 0; }
  .goal-step-entry-head .goal-step-entry-title { flex: 1; min-width: 0; }
  .goal-step-entry-head .task-manager-actions { margin-left: auto; flex-shrink: 0; }
  .goal-step-entry-content-indent { margin: 6px 0 0 26px; font-size: 13px; color: var(--ink-muted); }
  .goal-step-entry-content-indent strong, .goal-step-entry-content-indent b { color: var(--ink); }
  .goal-step-entry-drag-handle { cursor: grab; }
  .goal-step-entry-drag-handle svg { width: 15px; height: 15px; }
  .goal-step-entry-row.dragging { opacity: 0.35; }
  .goal-step-entry-row.drag-over { outline: 2px dashed var(--accent-gold); outline-offset: 4px; border-radius: 10px; }
  .goal-step-tab-add-btn { padding: 8px 12px !important; }
  .goal-step-tab-add-btn svg { width: 15px; height: 15px; }
  .goal-step-tab-add-form { display: inline-flex; align-items: center; gap: 4px; }
  .goal-step-tab-add-input {
    font: inherit; font-size: 13px; font-weight: 600; border: 1px solid var(--accent-gold);
    border-radius: 999px; background: var(--paper); color: var(--ink); padding: 7px 14px; height: 36px; width: 160px;
  }
  /* 나의 도전 탭: 한 줄에 정확히 3개씩, 넘치면 다음 줄로. 제목이 길면 줄임표(...)로 자른다.
     .settings-tabs의 기본 flex 규칙보다 뒤에서 이겨야 하므로 클래스를 겹쳐서 특정도를 높인다. */
  .settings-tabs.portfolio-goal-tabs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
  .portfolio-goal-tabs .goal-step-tab-btn,
  .portfolio-goal-tabs .goal-step-tab-add-btn { width: 100%; box-sizing: border-box; justify-content: flex-start; }
  .portfolio-goal-tabs .goal-step-tab-add-btn { justify-content: center; }
  .portfolio-goal-tabs .goal-step-tab-btn > span:last-child {
    flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; text-align: left;
  }
  .portfolio-goal-tabs .goal-step-tab-add-form { grid-column: 1 / -1; width: 100%; box-sizing: border-box; }
  .portfolio-goal-tabs .goal-step-tab-add-input { flex: 1; min-width: 0; width: auto; }
  .goal-step-entry-title-input { display: block; width: 100%; margin-bottom: 6px; }
  .settings-goal-stack { display: flex; flex-direction: column; gap: 20px; }
  .btn-ghost {
    font: inherit;
    font-weight: 600;
    font-size: 13.5px;
    background: transparent;
    border: 1.5px solid var(--accent-gold);
    color: var(--ink);
    padding: 7px 14px;
    border-radius: 999px;
    cursor: pointer;
  }
  .btn-ghost:hover { background: var(--accent-gold); color: #2B2620; }

  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
  }
  @media (max-width: 700px) {
    .grid-2 { grid-template-columns: 1fr; }
  }

  .dash-cards { display: flex; flex-direction: column; gap: 22px; }
  .dash-card-wrap { position: relative; }
  .dash-card-wrap .drag-handle {
    position: absolute;
    top: 12px;
    right: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 26px;
    height: 26px;
    border-radius: 8px;
    color: var(--muted);
    cursor: grab;
    z-index: 2;
  }
  .dash-card-wrap .drag-handle svg { width: 17.5px; height: 17.5px; }
  .dash-card-wrap .drag-handle:hover { background: var(--grid-line); color: var(--ink); }
  .dash-card-wrap.dragging { opacity: 0.35; cursor: grabbing; }
  .dash-card-wrap.drag-over { outline: 2px dashed var(--accent-gold); outline-offset: 4px; border-radius: 14px; }
  /* 마감 일정을 드래그해서 날짜를 옮길 때: 드래그 중인 항목은 옅게, 놓을 수 있는
     날짜 칸(월간 칸/주간 칸)은 테두리로 강조한다. */
  .deadline-item-draggable { cursor: grab; }

  .cal-cell.drag-over { outline: 2px dashed var(--accent-gold); outline-offset: -2px; border-radius: 14px; }
  .week-col.drag-over { outline: 2px dashed var(--accent-gold); outline-offset: -2px; border-radius: 10px; }
  .settings-card-wrap.dragging { opacity: 0.35; }
  .settings-card-wrap.drag-over { outline: 2px dashed var(--accent-gold); outline-offset: 4px; border-radius: 14px; }
  .settings-card-wrap { margin-top: 20px; }
  .settings-card-wrap .card-head { position: relative; padding-right: 30px; }
  .settings-card-drag-strip {

    height: 22px;

  .portfolio-page-card-wrap { min-width: 0; }
  .portfolio-page-card-wrap .card-head { position: relative; padding-right: 30px; }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 20px 22px;
    box-shadow: var(--shadow);
    display: flex;
    flex-direction: column;
    transition: height .2s ease, min-height .2s ease, background-color .12s ease, border-color .12s ease;
  }
  .card-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
  }
  .card-head h3 { font-size: 18px; display: flex; align-items: center; }
  .card-head > p { padding-left: 15px; }
  .card-head > div { padding-left: 15px; }
  .date-tag { font-size: 11.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums; }

  .task-list { list-style: none; margin: 0; padding: 0; padding-left: 15px; display: flex; flex-direction: column; gap: 4px; }
  .task-list-capped {
    max-height: 220px;
    overflow-y: auto;
    padding-right: 4px;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .task-list-capped::-webkit-scrollbar { width: 6px; }
  .task-list-capped::-webkit-scrollbar-track { background: transparent; }
  .task-list-capped::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }
  .task { border-radius: 10px; }
  .task label {
    display: grid;
    grid-template-columns: 20px 1fr auto;
    align-items: center;
    gap: 10px;
    padding: 9px 8px;
    cursor: pointer;
    border-radius: 10px;
  }
  .task label:hover { background: var(--grid-line); }
  .task input[type="checkbox"] {
    position: absolute;
    opacity: 0;
    width: 20px;
    height: 20px;
  }
  /* 체크박스는 사각 테두리 대신, 체크 아이콘 자체를 옅게(0.4)/진하게(1) 해서
     체크 여부를 보여준다 — 테두리 박스 느낌을 없애고 아이콘 하나로 통일. */
  .box {
    width: 19px;
    height: 19px;
    border: none;
    border-radius: 0;
    background: none;
    position: relative;
    flex-shrink: 0;
  }
  .box::after {
    content: "";
    position: absolute;
    left: 50%;
    top: 46%;
    width: 28%;
    height: 52%;
    border: solid var(--check-ink);
    border-width: 0 2px 2px 0;
    transform: translate(-50%, -50%) rotate(40deg);
    opacity: 0.2;
  }
  .task input:checked ~ .box::after { opacity: 1; }
  .task input:focus-visible ~ .box { outline: 2px solid var(--accent-blue); outline-offset: 2px; }
  .task-label { font-size: 14.5px; }
  .task.done .task-label { color: var(--ink-muted); text-decoration: line-through; text-decoration-color: var(--ink-muted); }
  .task-meta { font-size: 11.5px; color: var(--ink-muted); white-space: nowrap; text-align: right; }

  .allclear { margin: 12px 2px 0; font-size: 13.5px; color: var(--accent-text); font-weight: 600; display: flex; align-items: center; gap: 6px; }
  .allclear svg { width: 15px; height: 15px; flex-shrink: 0; }
  .hint { margin: 12px 2px 0; font-size: 12.5px; color: var(--ink-muted); }

  .foot { text-align: center; color: var(--ink-muted); font-size: 12px; padding-top: 6px; }

  a { color: var(--accent-blue); }

  .portfolio-card .card-head { margin-bottom: 4px; align-items: flex-start; }
  .portfolio-sub { font-size: 11.5px; color: var(--ink-muted); margin: 0 0 10px; padding-left: 15px; }
  .portfolio-link { color: var(--accent-text); font-weight: 600; text-decoration: underline; text-underline-offset: 2px; }
  .portfolio-link:hover { color: var(--accent-gold-dark); }
  .portfolio-link-updated { margin-left: 8px; color: var(--ink-muted); font-size: 11px; white-space: nowrap; }
  .note { border-bottom: 1px solid var(--border); }
  .note:last-child { border-bottom: none; }
  .note > summary {
    cursor: pointer;
    padding: 10px 2px;
    font-size: 13.5px;
    font-weight: 600;
    list-style: none;
  }
  .note > summary::-webkit-details-marker { display: none; }
  .note > summary::before { content: "＋ "; color: var(--accent-text); }
  .note[open] > summary::before { content: "－ "; }
  .note p { margin: 0 2px 12px; font-size: 12.5px; color: var(--ink-muted); line-height: 1.6; }
  .note .md-body { padding: 0 15px 10px 15px; font-size: 12.5px; color: var(--ink-muted); }
  .goal-card .card-head { margin-bottom: 4px; }

  .month-section { margin-top: 2px; }
  .month-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 8px 14px;
    margin-bottom: 10px;
  }
  .month-head h3 { font-size: 17px; font-variant-numeric: tabular-nums; position: relative; }
  .month-head-daterange { font-size: 12px; font-weight: 400; color: var(--ink-muted); }
  .week-jump-title-btn { font: inherit; font-size: inherit; font-weight: inherit; color: inherit; background: none; border: none; padding: 0; cursor: pointer; border-radius: 6px; }
  .week-jump-title-btn:hover { color: var(--accent-gold); text-decoration: underline; }
  .week-jump-popover {
    position: absolute; top: calc(100% + 6px); left: 0; z-index: 10;
    display: flex; align-items: center; gap: 6px;
    background: var(--card); border: 1px solid var(--border); border-radius: 10px;
    padding: 8px; box-shadow: var(--shadow); width: max-content;
  }
  .week-jump-select { font: inherit; font-size: 12.5px; border: 1px solid var(--border); border-radius: 6px; background: var(--paper); color: var(--ink); padding: 3px 4px; }
  .week-jump-go-btn { flex-shrink: 0; }
  .cal-nav { display: flex; align-items: center; gap: 4px; }
  .cal-nav-btn {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    color: var(--ink-muted);
    font-size: 13px;
    padding: 5px 10px;
    cursor: pointer;
    line-height: 1;
    font-family: inherit;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  .cal-nav-btn:hover { border-color: var(--accent-gold); color: var(--ink); }
  .cal-nav-btn svg { width: 14px; height: 14px; flex-shrink: 0; }
  .cal-today-btn { font-weight: 600; color: var(--accent-text); }
  .month-stats { font-size: 12px; color: var(--ink-muted); margin: 0 0 12px; font-variant-numeric: tabular-nums; }
  .cal-weekdays {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
    margin-bottom: 6px;
  }
  .cal-weekday {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-muted);
    font-weight: 600;
  }
  .cal-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 6px;
  }
  .cal-cell {
    position: relative;
    /* 날짜 숫자 줄 + 마감 칩 5개(각 칩 높이 16px + 칩 사이 gap 2px) + 칩 목록과 날짜
       줄 사이 gap을 더해, 마감 개수와 상관없이 모든 칸 높이가 동일하도록 고정한다. */
    height: 138px;
    min-height: 138px;
    border: 1px solid var(--border);
    border-radius: 10px;
    background: var(--card);
    padding: 6px 6px 5px;
    display: flex;
    flex-direction: column;
    gap: 4px;
    overflow: hidden;
    cursor: pointer;
    transition: background-color .12s ease, border-color .12s ease;
  }
  .cal-cell:hover { border-color: var(--accent-gold); background: var(--accent-gold-soft); }
  .cal-cell.outside { opacity: 0.4; }
  .cal-cell.cal-cell-future { cursor: default; }
  .cal-cell.cal-cell-future:hover { border-color: var(--border); background: var(--card); }
  /* 오늘 이후 날짜는 흐리게 표시하되, 마감 일정 표시(칩)는 눈에 잘 띄어야 하므로
     칸 전체에 opacity를 주지 않고 마감 표시를 제외한 나머지 요소에만 적용한다. */
  .cal-cell.cal-cell-future > *:not(.cal-deadline-chips) { opacity: 0.4; }
  .cal-diary-mark { flex-shrink: 0; font-size: 12px; line-height: 1; color: var(--ink-muted); display: inline-flex; }
  .cal-diary-mark svg { width: 11px; height: 11px; }
  .cal-cell-top { display: flex; align-items: center; justify-content: space-between; gap: 5px; }
  .cal-cell-top-right { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
  .cal-daynum {
    font-size: 12px;
    line-height: 1;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    width: 20px;
    height: 20px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 999px;
    flex-shrink: 0;
  }
  .cal-cell.today .cal-daynum {
    background: var(--accent-gold);
    color: var(--accent-ink-solid);
    font-weight: 700;
  }
  /* 일요일/공휴일 날짜 숫자는 빨간 글씨로 구분한다(오늘 날짜 칸은 강조색 배경이
     이미 있으니 그대로 두고 빨간색을 덮어쓰지 않는다 — 아래 today 규칙이 클래스
     3개짜리라 항상 이긴다). */
  .cal-daynum.cal-daynum-red { color: #C0524A; }
  .cal-weekday.cal-weekday-sun { color: #C0524A; }
  .cal-holiday-label {
    display: block;
    font-size: 10px;
    font-weight: 600;
    line-height: 1.2;
    color: #C0524A;
    margin: 1px 0 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  /* 체크한 할 일 표시: 다 체크된 날엔 일기 아이콘 옆(맨 위 줄)에 다이아(반짝임)만
     인라인으로 보여준다(칸 우측 상단, 오른쪽 한 곳에서만 진행 상황을 알 수 있게). */
  .cal-done-mark {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    min-width: 15px;
    height: 14px;
    padding: 0 4px;
    border-radius: 999px;
    background: var(--accent-gold);
    color: var(--accent-ink-solid);
    font-size: 9px;
    line-height: 1;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    flex-shrink: 0;
  }
  /* 마감 표시(칩)와 뚜렷이 구분되도록, 올클리어 표시는 끝이 뾰족한
     반짝임(✨) 모양으로 만든다 — 단순히 사각형을 45도 돌린 것보다 더 또렷하다. */
  .cal-done-mark-all {
    min-width: 11px;
    width: 11px;
    height: 11px;
    padding: 0;
    border-radius: 0;
    background: var(--accent-gold-dark, var(--accent-bg));
    clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
  }
  /* 그 날의 "오늘의 일정"(규칙적인 일정)이 전부 체크됐을 때 뜨는 별 아이콘. */
  .cal-done-mark-recurring {
    min-width: 14px;
    width: 14px;
    height: 14px;
    padding: 0;
    border-radius: 0;
    background: none;
    color: var(--accent-gold-dark, var(--accent-bg));
  }
  .cal-done-mark-recurring svg { width: 100%; height: 100%; display: block; }
  /* 그 날의 마감 일정이 전부 체크됐을 때 뜨는 원형 아이콘. 다른 완료 표시 아이콘들과
     가로·세로 크기를 맞춘다. */
  .cal-done-mark-deadline {
    min-width: 8px;
    width: 8px;
    height: 8px;
    padding: 0;
    border-radius: 999px;
    background: var(--accent-gold-dark, var(--accent-bg));
  }
  /* 데일리 체크리스트 진행 상황: 다른 완료 표시들과 같은 자리(칸 우측 상단)에 고정해서
     보여준다. 남은 개수는 숫자 배지(.cal-done-mark 기본 알약 모양)로, 전부 체크되면
     채워진 다이아(반짝임) 아이콘으로 바뀐다. */
  .cal-done-mark-daily {
    background: var(--grid-line);
    color: var(--ink-muted);
    border: 1px solid var(--border);
  }
  .cal-done-mark-daily-star {
    min-width: 5px;
    width: 5px;
    height: 5px;
    padding: 0;
    border-radius: 0;
    background: var(--accent-gold-dark, var(--accent-bg));
    border: none;
    clip-path: polygon(50% 0%, 62% 38%, 100% 50%, 62% 62%, 50% 100%, 38% 62%, 0% 50%, 38% 38%);
  }
  .cal-deadline-chips { display: flex; flex-direction: column; gap: 2px; width: 100%; }
  .cal-deadline-chip {
    display: flex;
    align-items: center;
    gap: 3px;
    font-size: 9.5px;
    line-height: 1.35;
    font-weight: 600;
    padding: 1.5px 5px;
    border-radius: 5px;
    color: var(--ink);
    max-width: 100%;
  }
  .cal-deadline-chip-text { flex: 1 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-deadline-chip-done .cal-deadline-chip-text { opacity: 0.55; }
  /* 체크 표시는 항목 고유 색(--item-color)을 밝게 섞어서 배경에 눌리지 않고 또렷하게 튀어 보이게 한다. */
  .cal-deadline-chip-check { flex-shrink: 0; display: inline-flex; color: color-mix(in srgb, var(--item-color, var(--accent-gold-dark)) 70%, #fff 30%); }
  .cal-deadline-chip-check svg { width: 9px; height: 9px; }
  .cal-deadline-chip-check svg path { stroke-width: 2.6px; }
  .month-section-compact .cal-deadline-chip-check svg { width: 8px; height: 8px; }
  .cal-deadline-chip-more { box-sizing: border-box; color: var(--ink-muted); background: var(--grid-line) !important; border: 1px solid var(--border); justify-content: center; font-variant-numeric: tabular-nums; }
  /* 데일리 체크리스트 항목은 마감/반복 일정처럼 고유 색이 없어서, 색 배경 대신 테두리만
     있는 칩으로 구분되게 한다. */
  .cal-deadline-chip-daily { box-sizing: border-box; background: var(--card) !important; border: 1px solid var(--border); color: var(--ink); }
  /* 마감(체크리스트) 칩은 흰(카드) 배경 + 옅은 테두리를 쓰고, 항목 고유색은 앞에 작은
     동그란 뱃지로만 붙여서 알려준다. */
  .cal-deadline-chip-deadline { box-sizing: border-box; border: 1px solid var(--border); color: var(--ink); }
  .cal-deadline-chip-badge {
    flex-shrink: 0;
    width: 7px;
    height: 7px;
    border-radius: 999px;
    background: var(--item-color, var(--accent-gold-dark));
  }
  /* 규칙적인 일정 칩은 마감(체크리스트) 칩과 헷갈리지 않도록 색 채운 배경 대신 흰(카드)
     배경 + 항목색 점선 테두리로 구분한다(아이콘은 쓰지 않는다). */
  .cal-deadline-chip-recurring { box-sizing: border-box; border: 1px solid var(--item-color, var(--accent-gold-dark)); color: var(--ink); }
  /* 규칙적인 일정 칩 앞에는 항목 고유색으로 채운 별 아이콘을 붙인다. */
  .cal-deadline-chip-star {
    flex-shrink: 0;
    width: 9px;
    height: 9px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: var(--item-color, var(--accent-gold-dark));
  }
  .cal-deadline-chip-star svg { width: 100%; height: 100%; display: block; }
  @media (max-width: 700px) {
    .cal-cell { height: 116px; min-height: 116px; }
  }
  @media (max-width: 560px) {
    .cal-weekday { font-size: 10px; }
    .cal-daynum { font-size: 10px; width: 18px; height: 18px; }
    .cal-cell { height: 100px; min-height: 100px; padding: 4px; }
  }
  /* 체크리스트 페이지의 월간 달력은 날짜칸 높이를 전부 동일하게 고정한다 — 오늘의
     일정+마감 일정이 최대 5개까지 나올 수 있으니, 그 5개가 항상 다 들어가는 높이로
     고정해서 항목 수와 상관없이 모든 칸이 같은 크기로 맞춰지게 한다(aspect-ratio로
     정사각형을 강제하면 그 높이가 너비에 매여 5개가 다 안 들어가고 잘리므로 쓰지
     않는다). 칸이 작아서 글자·여백은 일기 사이드바의 작은 달력처럼 줄여서 쓴다. */
  .checklist-month-cal .cal-cell { height: 94px; min-height: 94px; padding: 3px; overflow: hidden; }
  .checklist-month-cal .cal-cell-top { gap: 2px; }
  .checklist-month-cal .cal-cell-top-right { gap: 2px; }
  .checklist-month-cal .cal-daynum { font-size: 9px; width: 14px; height: 14px; }
  .checklist-month-cal .cal-deadline-chips { gap: 2px; }
  .checklist-month-cal .cal-deadline-chip { font-size: 7.5px; padding: 0.5px 3px; line-height: 1.15; }
  .checklist-month-cal .cal-deadline-chip-badge { width: 5.5px; height: 5.5px; }
  .checklist-month-cal .cal-deadline-chip-star { width: 7px; height: 7px; }
  .checklist-month-cal .cal-done-mark { min-width: 12px; height: 11px; font-size: 7.5px; padding: 0 3px; }
  .checklist-month-cal .cal-done-mark-all { min-width: 7px; width: 7px; height: 7px; padding: 0; }
  .checklist-month-cal .cal-done-mark-recurring { min-width: 9.5px; width: 9.5px; height: 9.5px; padding: 0; }
  .checklist-month-cal .cal-done-mark-deadline { min-width: 5px; width: 5px; height: 5px; padding: 0; }
  /* 아래 두 규칙은 반드시 위의 .cal-done-mark 기본 규칙보다 뒤에 와야 한다 — 같은
     명시도(두 클래스 결합)에서는 나중에 나온 규칙이 이기므로, 앞에 두면 min-width/

  .checklist-month-cal .cal-done-mark-daily { min-width: 11px; height: 10px; font-size: 7px; padding: 0 2.5px; }

  .page-title { margin-bottom: 4px; }

  .diary-page { display: flex; flex-direction: column; gap: 14px; }

  .diary-date-display { display: flex; align-items: center; gap: 10px; flex: 1; min-width: 0; }

  /* 사이드바 작은 달력 칸이 너무 좁으면 일기 아이콘 + 데일리 체크 배지가 한 줄에

  .diary-layout { display: grid; grid-template-columns: 1fr minmax(420px, 44%); gap: 20px; align-items: start; }
  @media (max-width: 960px) { .diary-layout { grid-template-columns: 1fr; } }
  /* 달력 → 마감 목록 → 일간 목표 → today list 순서로, 간격을 전부 5px로 통일한다. */
  .diary-sidebar { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
  .today-widget-card .task-label { font-size: 12.5px; line-height: 1.4; }
  .today-widget-card .task label { padding: 7px 6px; gap: 8px; }
  .today-widget-card .box { width: 17px; height: 17px; }
  .today-widget-card .card-head { flex-wrap: wrap; }

  .month-section-compact .month-head h3 { font-size: 14px; }
  .month-section-compact .cal-nav-btn { padding: 3px 7px; font-size: 11px; }
  .month-section-compact .cal-weekday { font-size: 10px; }
  .month-section-compact .cal-grid { gap: 3px; }
  /* 일기 사이드바의 작은 달력은 칸 높이를 5개 기준으로 고정하는 큰 달력과 달리,
     늘 정사각형이어야 하므로 height를 도로 auto로 풀고 aspect-ratio로만 정사각형을 잡는다. */
  .month-section-compact .cal-cell { height: auto; min-height: 0; aspect-ratio: 1 / 1; padding: 2px 3px 2px 2px; border-radius: 7px; }
  .month-section-compact .cal-cell-top { gap: 2px; align-items: center; }
  /* 칸 우측 상단엔 일기 표시 + 데일리 체크리스트 완료 표시(최대 2개)만 두므로
     격자로 위치를 고정할 필요 없이 원래대로 한 줄 flex로 둔다. */
  .month-section-compact .cal-cell-top-right { gap: 2px; }
  .month-section-compact .cal-daynum { font-size: 10px; width: 16px; height: 16px; }
  .month-section-compact .cal-deadline-chip { font-size: 8px; padding: 1px 3px; }
  .month-section-compact .cal-done-mark { min-width: 12px; height: 11px; font-size: 7.5px; padding: 0 3px; }
  .month-section-compact .cal-done-mark-all { min-width: 7px; width: 7px; height: 7px; padding: 0; }
  .month-section-compact .cal-done-mark-recurring { min-width: 9.5px; width: 9.5px; height: 9.5px; padding: 0; }
  .month-section-compact .cal-done-mark-deadline { min-width: 5px; width: 5px; height: 5px; padding: 0; }
  .month-section-compact .cal-done-mark-daily { min-width: 11px; height: 10px; font-size: 7px; padding: 0 2.5px; }
  .month-section-compact .cal-done-mark-daily-star { min-width: 7px; width: 7px; height: 7px; padding: 0; }
  .month-section-compact .cal-diary-mark svg { width: 8px; height: 8px; }
  /* 작은 달력의 마감 점(dot) 목록: 칩 대신 색 점으로 간단히 표시하고, 5개를 넘으면
     "+n" 텍스트로 나머지를 요약해 붙인다. 규칙적인 일정 줄, 마감 일정 줄을 각각
     따로 한 줄씩 두고(cal-cell-bottom-group), 그 묶음 전체를 칸 맨 아래에 붙인다. */
  .cal-cell-bottom-group { display: flex; flex-direction: column; gap: 2px; width: 100%; margin-top: auto; }
  .cal-deadline-dots { display: flex; align-items: center; justify-content: flex-start; flex-wrap: wrap; gap: 2px; width: 100%; }
  .cal-deadline-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--item-color, var(--accent-gold-dark)); flex-shrink: 0; }
  .cal-deadline-dot-done { opacity: 0.35; }
  .cal-deadline-dot-more { font-size: 7.5px; font-weight: 700; line-height: 1; color: var(--ink-muted); flex-shrink: 0; margin-left: auto; padding-left: 2px; }
  /* 일기 사이드바 작은 달력 전용: 규칙적인 일정/마감 일정이 전부 체크된 날엔 그 줄에
     점 목록 대신 완료 아이콘 하나만 줄 오른쪽 끝에 보여준다. */
  .cal-cell-mark-line { display: flex; align-items: center; justify-content: flex-end; width: 100%; }
  /* 별/원 아이콘 폭이 서로 달라도 같은 세로선에 오도록, 고정 폭 슬롯 가운데에
     아이콘을 정렬한다(폭은 둘 중 더 넓은 별 아이콘 기준: 9.5px). */
  .cal-cell-mark-slot { display: flex; align-items: center; justify-content: center; width: 9.5px; flex-shrink: 0; }
  .cal-cell.diary-selected { background: color-mix(in srgb, var(--accent-gold) 45%, transparent); border-color: var(--accent-gold); }

  .checklist-cal-mode-tabs { margin-bottom: 12px; }
  .week-columns-wrap { overflow-x: auto; margin: 0 -2px; padding: 0 2px 4px; }
  /* 일 월 화 수 / 목 금 토 메모 — 4열 x 2행 그리드. 자식 순서(일~토, 그다음 메모)가
     그대로 이 배치가 되도록 DOM 순서를 맞춰서 렌더링한다. */
  .week-columns { display: grid; grid-template-columns: repeat(4, minmax(150px, 1fr)); gap: 8px; }
  .week-col {
    min-height: 260px;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card);
    padding: 10px 8px 12px;
    display: flex;
    flex-direction: column;
  }
  .week-col.today { background: var(--accent-gold-pale); border-color: var(--accent-gold-soft); }
  .week-col.past .week-col-tasks,
  .week-col.future .week-col-tasks { opacity: 0.55; }
  .week-col.diary-selected.today { border-color: var(--accent-gold); }
  .week-col.diary-selected:not(.today) { border-color: var(--accent-gold); }
  .week-memo-col { background: transparent; }
  .week-memo-head { cursor: default; background: transparent; background-color: transparent !important; color: var(--ink); }
  .week-memo-textarea {
    flex: 1;
    min-height: 140px;
    resize: none;
    overflow: hidden;
    border: none;
    background: transparent;
    font: inherit;
    color: inherit;
    line-height: 1.5;
    padding: 4px 2px;
    outline: none;
  }
  .week-memo-textarea::placeholder { color: var(--ink-muted); }
  .week-memo-view { flex: 1; min-height: 140px; line-height: 1.5; padding: 4px 2px; cursor: pointer; border-radius: 6px; font-size: 12.5px; }
  .week-memo-view.diary-preview { border: none; background: transparent; box-shadow: none; min-height: 140px; padding: 4px 2px; }
  .week-memo-view:hover { background: var(--card); }
  .week-memo-footer { display: flex; align-items: center; justify-content: flex-end; gap: 8px; margin-top: 4px; flex-shrink: 0; }
  .week-memo-save-status { font-size: 11px; color: var(--ink-muted); }
  .week-memo-save-btn { font-size: 11.5px; padding: 4px 12px; }
  .week-col-head {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 5px;
    width: 100%;
    /* 요일·날짜 헤더 배경은 테마 그라데이션의 첫번째(시작) 색으로 채운다. */
    background: var(--accent-gold);
    border: none;
    border-radius: 8px 8px 0 0;
    padding: 6px 0 8px;
    margin: -10px -8px 8px;
    width: calc(100% + 16px);
    cursor: pointer;
    color: var(--accent-ink-solid);
    font: inherit;
  }
  .week-col-head-top { display: flex; align-items: baseline; gap: 4px; }
  .week-col-weekday { font-size: 14px; font-weight: 700; }
  .week-col-daynum { font-size: 12.5px; color: var(--accent-ink-solid); opacity: 0.75; }
  .week-col-section-label { font-size: 11px; font-weight: 700; color: var(--ink-muted); letter-spacing: 0.02em; margin: 2px 0 4px; }
  .week-col-section-label-deadlines, .week-col-section-label-tasks { margin-top: 5px; }
  .week-col-tasks { margin: 8px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--border); list-style: none; display: flex; flex-direction: column; gap: 1px; min-height: 100px; }
  .week-col-tasks .task-label { font-size: 12.5px; line-height: 1.4; }
  .week-col-tasks li.task { padding: 1.5px 0; }
  .week-col-tasks .task label { padding: 4.5px 8px; gap: 6px; }
  .week-col .task-empty-hint { font-size: 11.5px; padding: 2px 0; }
  .week-col-deadlines { margin: 8px 0 0; padding: 8px 0 0; border-top: 1px dashed var(--border); list-style: none; display: flex; flex-direction: column; gap: 1px; min-height: 35px; }
  .week-col-section-label + ul { padding-left: 10px; padding-right: 10px; }
  .week-col-deadline-item { display: flex; align-items: center; gap: 6px; padding: 4.5px 8px; }
  .week-col-deadline-item .deadline-item-check { flex: 1; min-width: 0; }
  .week-col-deadline-label { font-size: 11.5px; line-height: 1.4; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .week-col-deadline-item.done .week-col-deadline-label { text-decoration: line-through; color: var(--ink-muted); }
  .week-col-deadline-item-overdue { gap: 4px; }
  .week-col-deadline-dday { margin-left: auto; flex-shrink: 0; font-size: 10.5px; font-weight: 700; color: #C0524A; white-space: nowrap; }
  .cal-weekday-mini { font-size: 12.5px; color: var(--ink-muted); font-weight: 600; }
  .month-section-day .month-head h3 { display: flex; align-items: center; gap: 8px; font-size: 19px; }
  .checklist-detail-section { margin-top: 4px; }
  .checklist-detail-section .card-head h3 { flex-wrap: wrap; }
  .checklist-detail-hint { flex-basis: 100%; font-size: 11.5px; font-weight: 400; color: var(--ink-muted); margin-left: 0; margin-top: 2px; }
  .checklist-detail-subhead { font-size: 18px; font-weight: 700; margin: 16px 0 14px; display: flex; align-items: center; }
  /* 오늘의 일정/할일 목록/마감 일정 섹션을 드래그로 순서 바꿀 수 있게 감싸는 래퍼.
     드래그 손잡이가 소제목 글자와 겹치지 않도록 자리를 비켜둔다. */
  .checklist-detail-card-wrap { position: relative; }
  .checklist-detail-card-wrap .drag-handle { top: 10px; right: 0; width: 22px; height: 22px; }
  .checklist-detail-card-wrap .drag-handle svg { width: 15px; height: 15px; }
  .checklist-detail-card-wrap .checklist-detail-subhead { padding-right: 28px; }
  .checklist-detail-card-wrap:first-child .checklist-detail-subhead { margin-top: 4px; }
  /* 체크리스트 상세 패널: 할일 항목끼리는 더 촘촘하게, 마감 목록 항목끼리는 더 여유있게. */
  .checklist-detail-section .task-list { gap: 1px; }
  .checklist-detail-section .deadline-list { gap: 12px; }
  .checklist-section-divider { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .checklist-month-layout { display: flex; align-items: flex-start; gap: 20px; }
  .checklist-month-cal { flex: 0 0 63%; min-width: 0; }
  .checklist-month-side { flex: 0 0 35%; min-width: 0; }
  .checklist-month-side .checklist-detail-section { margin-top: 0; }
  @media (max-width: 640px) {
    .checklist-month-layout { flex-direction: column; align-items: stretch; }
    .checklist-month-cal { flex: 1 1 auto; width: 100%; }
    .checklist-month-side { flex: 1 1 auto; width: 100%; }
  }
  .deadline-empty-inline { color: var(--ink-muted); font-size: 13px; list-style: none; padding: 4px 2px; }

  .page-title-with-action { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .page-title-action { display: flex; align-items: center; gap: 6px; }
  .card-head-reminder { display: flex; align-items: center; gap: 6px; flex-shrink: 0; }
  .reminder-pill-btn { display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
  .reminder-pill-btn svg { width: 14px; height: 14px; }
  .task-reminder-pill-btn { height: 30px; padding: 0 10px; font-size: 12px; flex-shrink: 0; color: var(--ink-muted); }
  .task-reminder-pill-btn.reminder-pill-btn-set { color: var(--ink); border-color: var(--accent-gold); }
  /* 자기만의 알림 시간이 없어서 기본 알림 시간을 대신 쓰는 항목: 시간을 옅은 색으로
     보여줘서, 직접 정한 알림(진한 색)과는 구분되면서도 "언제 울릴지"는 알 수 있게 한다. */
  .task-reminder-pill-btn.reminder-pill-btn-default { color: var(--ink-muted); border-style: dashed; }
  .task-manager-desc-page { font-size: 12.5px; color: var(--ink-muted); line-height: 1.6; margin: 0 0 4px; padding-left: 15px; }

  .cal-page-columns { display: grid; grid-template-columns: 1fr 300px; gap: 20px; align-items: start; }
  @media (max-width: 900px) { .cal-page-columns { grid-template-columns: 1fr; } }
  .deadline-card .card-head { margin-bottom: 10px; }
  .deadline-list { list-style: none; margin: 0; padding: 0; padding-left: 15px; display: flex; flex-direction: column; gap: 8px; }
  .deadline-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 7px 8px; border-radius: 8px; background: var(--grid-line); }
  .deadline-item-check { display: flex; align-items: center; gap: 8px; min-width: 0; cursor: pointer; flex: 1; }
  .deadline-item-check input[type="checkbox"] { position: absolute; opacity: 0; width: 18px; height: 18px; }
  /* 체크 전에도 완료됐을 때와 똑같은 모양의 네모칸(둥근 사각 테두리)을 항상 보여준다. */
  .deadline-item-check .box { width: 16px; height: 16px; border: 1.5px solid var(--item-color, var(--border)); border-radius: 6px; background: none; position: relative; flex-shrink: 0; transition: background-color .12s ease, border-color .12s ease; }
  .deadline-item-check .box::after { content: ""; position: absolute; left: 50%; top: 46%; width: 28%; height: 52%; border: solid var(--check-ink); border-width: 0 2px 2px 0; transform: translate(-50%, -50%) rotate(40deg); opacity: 0; }
  /* 체크되면 그 마감 일정에 지정된 색으로 체크박스 자체를 채워서, 어떤 색 마감이
     완료됐는지 한눈에 보이게 한다. 다만 완료된 항목은 시각적으로 옅어져 보이도록
     체크박스 전체를 0.5 오퍼시티로 낮춘다. */
  .deadline-item-check input:checked ~ .box { background: var(--item-color, var(--accent-bg)); border-color: var(--item-color, var(--accent-bg)); border-radius: 6px; opacity: 0.5; }
  .deadline-item-check input:checked ~ .box::after { border-color: #fff; opacity: 1; }
  .deadline-item-check-standalone { flex: none; }
  .deadline-item-label { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .deadline-item-date { font-size: 11.5px; white-space: nowrap; }
  .deadline-dday-badge { flex-shrink: 0; cursor: default; }
  /* D-day 배지는 누를 수 있는 버튼이 아니라 상태 표시라서, 공용 .chip-btn 호버 효과(진하게+포인터)를 지운다. */
  .deadline-dday-badge:hover { border-color: var(--accent-gold); color: var(--accent-text); }
  .deadline-dday-badge.dday-today:hover { border-color: #C0524A; color: #C0524A; }
  .chip-btn-set.dday-today { background: #F6DAD8; color: #C0524A; border-color: #C0524A; }
  /* D+n(마감이 지남)은 오늘(D-DAY)의 빨강과는 다른 톤(진한 주황)으로, D-n(남음)은
     차분한 파랑 계열로 구분해서 한눈에 지남/오늘/남음을 알 수 있게 한다. */
  .deadline-dday-badge.dday-overdue:hover { border-color: #B5560F; color: #B5560F; }
  .chip-btn-set.dday-overdue { background: #FBE1CC; color: #B5560F; border-color: #B5560F; }
  .deadline-dday-badge.dday-upcoming:hover { border-color: #3E6FA8; color: #3E6FA8; }
  .chip-btn-set.dday-upcoming { background: #DCE7F5; color: #3E6FA8; border-color: #3E6FA8; }
  /* D-3 이하(임박)는 여유 있는 D-4 이상의 파랑과 구분되게 경고성 노랑/호박색으로 표시한다. */
  .deadline-dday-badge.dday-urgent:hover { border-color: #A5790A; color: #A5790A; }
  .chip-btn-set.dday-urgent { background: #FBEDC4; color: #A5790A; border-color: #A5790A; }
  .deadline-empty { color: var(--ink-muted); font-size: 13px; margin: 0; padding-left: 15px; display: flex; align-items: center; gap: 6px; }
  .deadline-empty svg { width: 15px; height: 15px; flex-shrink: 0; }
  /* 완료된 항목은 텍스트만 옅게/취소선으로 표시하고, 체크 아이콘은 흐려지지
     않고 진한 테마톤 그대로 또렷하게 보이게 한다. */
  .deadline-item-done .deadline-item-label { text-decoration: line-through; color: var(--ink-muted); }
  .task-manager-label-done { text-decoration: line-through; color: var(--ink-muted); }

  function versionCheckStatusHtml() {

  function exportDataToFileLegacy(json, filename) {
    try {
      var blob = new Blob([json], { type: "application/json" });
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = filename;

      document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
      dataBackupNotice = "";
    } catch (e) {
      dataBackupNotice = tr("올바른 백업 파일이 아니에요.");
      render();
    }

  function exportDataToFile() {
    try {
      saveState();
      var json = JSON.stringify(state, null, 2);
      var filename = "tracker-backup-" + todayStr() + ".json";

      if (window.claude && typeof window.claude.use === "function") {
        window.claude.use("downloads").then(function (downloads) {
          if (!downloads) { exportDataToFileLegacy(json, filename); return; }
          var blob = new Blob([json], { type: "application/json" });

  function inlineMarkdown(s) {

  // 마크다운 확장: "| 텍스트"로 시작하는 줄은 주석(왼쪽 세로줄) 블록으로,
  // "> 텍스트"로 시작하는 줄은 접고 펼 수 있는 드롭다운 블록으로 렌더링한다.
  // (첫 줄이 제목, 뒤이어 계속되는 "> " 줄들은 펼쳤을 때 보이는 본문이 된다.)
  // 이 두 확장은 이 함수를 쓰는 모든 마크다운 텍스트(일기, 주간 메모, 목표 설명 등)에 공통 적용된다.
  function renderMarkdownToHtml(src) {
    var rawLines = (src || "").split(/\r?\n/);
    var html = "";
    var inList = false;
    var i = 0;
    while (i < rawLines.length) {
      var trimmed = rawLines[i].trim();
      var quoteMatch = /^>\s?(.*)$/.exec(trimmed);
      var noteMatch = /^\|\s?(.*)$/.exec(trimmed);
      if (quoteMatch) {
        if (inList) { html += "</ul>"; inList = false; }
        var qLines = [quoteMatch[1]];
        var j = i + 1;
        while (j < rawLines.length) {
          var jTrim = rawLines[j].trim();
          if (jTrim === "") break;
          var qm = /^>\s?(.*)$/.exec(jTrim);
          qLines.push(qm ? qm[1] : jTrim);
          j++;
        }
        var qBody = qLines.slice(1);
        html += '<details class="md-dropdown" open><summary>' + inlineMarkdown(escapeHtml(qLines[0])) + "</summary>" +
          (qBody.length ? ('<div class="md-dropdown-body">' + qBody.map(function (l) { return '<div class="md-dropdown-item">' + inlineMarkdown(escapeHtml(l)) + "</div>"; }).join("") + "</div>") : "") +
          "</details>";
        i = j;
        continue;
      }
      if (noteMatch) {
        if (inList) { html += "</ul>"; inList = false; }
        var nLines = [noteMatch[1]];
        var k = i + 1;
        while (k < rawLines.length) {
          var nm = /^\|\s?(.*)$/.exec(rawLines[k].trim());
          if (!nm) break;
          nLines.push(nm[1]);
          k++;
        }
        html += '<div class="md-annotation">' + nLines.map(function (l) { return inlineMarkdown(escapeHtml(l)); }).join("<br>") + "</div>";
        i = k;
        continue;
      }
      var hrMatch = /^-{3,}$/.exec(trimmed);
      var headerMatch = /^(#{1,3})\s+(.*)$/.exec(trimmed);
      var listMatch = /^[-*]\s+(.*)$/.exec(trimmed);
      if (hrMatch) {
        if (inList) { html += "</ul>"; inList = false; }
        html += "<hr>";
      } else if (headerMatch) {
        if (inList) { html += "</ul>"; inList = false; }
        var level = headerMatch[1].length + 2;
        html += "<h" + level + ">" + inlineMarkdown(escapeHtml(headerMatch[2])) + "</h" + level + ">";
      } else if (listMatch) {
        if (!inList) { html += "<ul>"; inList = true; }
        html += "<li>" + inlineMarkdown(escapeHtml(listMatch[1])) + "</li>";
      } else if (trimmed === "") {
        if (inList) { html += "</ul>"; inList = false; }
      } else {
        if (inList) { html += "</ul>"; inList = false; }
        html += "<p>" + inlineMarkdown(escapeHtml(trimmed)) + "</p>";
      }
      i++;
    }
    if (inList) html += "</ul>";
    return html;
  }

      // 다르면 칸 높이도 자연히 달라지는데, 이건 의도된 것. 다 체크된 날엔 일기 아이콘
      // 옆에 다이아(반짝임) 표시만 인라인으로 두고, 아직 남은 개수("+n")는 윗줄이 아니라
      // 데일리 체크리스트 칩들 아래쪽에 둔다.
      var allTasksDone = state.dailyTasks.length > 0 && doneTasks.length === state.dailyTasks.length;

      var recurringForBadge = dueTasks.filter(function (t) { return t.recurring; });

      var allRecurringDone = recurringForBadge.length > 0 && recurringForBadge.every(function (t) { return t.done; });
      var allDeadlineDone = deadlineForBadge.length > 0 && deadlineForBadge.every(function (t) { return t.done; });

      // 항목이 있으면 그 진행 상황을 계속 보여준다(마감이 있는 날만 보이면 매일 하는
      // 습관 체크가 빠진 날처럼 보여서 헷갈린다). 다이어리 사이드바의 작은 달력은
      // 원래 목적대로 마감/반복 일정 표시만 남긴다.
      var hasAnythingToShow = dueTasks.length || (isChecklist && !compact && state.dailyTasks.length);
      if (!hasAnythingToShow) {

      } else if (compact) {
        // 일기 사이드바의 작은(정사각형) 달력에서는 규칙적인 일정 줄, 마감 일정 줄을

        // 라벨이 보이는 칩 대신 색 점으로 간단히 표시하되, 아직 체크 안 된 항목만
        // 기준으로 최대 3개까지 보여주고(완료된 항목은 점으로 따로 표시하지 않는다 —
        // 그 줄이 전부 체크되면 어차피 완료 아이콘으로 바뀐다), 나머지는 "+n"으로 요약한다.
        var maxVisibleDots = 3;
        var buildCompactMarkLine = function (items, allDone, doneMarkHtml) {

            // 오른쪽 끝에 붙이면(justify-content:flex-end) 오른쪽 "테두리"는 맞아도
            // 아이콘 자체의 가운데 위치는 서로 어긋나 보인다. 고정 폭 슬롯 안에 아이콘을
            // 가운데 정렬해서, 두 줄의 아이콘이 같은 x 위치(같은 세로선)에 오도록 맞춘다.

          // 그 다음 남는 개수만 "+n" 배지로 따로 붙인다.

            // 칸에 놓으면 마감일이 그 날짜로 바뀌게 한다. 규칙적인 일정은 요일 기준

      // 보여준다. 체크리스트 달력(월간, 큰 달력)은 기존처럼 전부 우측 상단에 모아 둔다.

        (clickable ? ' data-action="' + cellAction + '" data-date="' + key + '"' : "") + '>' +

      '<div class="cal-weekdays">' + weekdayHtml + "</div>" +
      '<div class="cal-grid">' + cellsHtml + "</div>" +
      "</section>"

  }

  function renderChecklistWeekSection(weekOffset) {
    var base = new Date(checklistSelectedDate + "T00:00:00");
    var start = new Date(base.getFullYear(), base.getMonth(), base.getDate() - base.getDay() + weekOffset * 7);
    var todayKey = todayStr();
    var endKeyOfWeek = todayStr(new Date(start.getFullYear(), start.getMonth(), start.getDate() + 6));
    // 이번 주(화면에 표시되는 주)에 오늘이 포함돼 있으면, 이미 지난(D+1 이상) 미완료
    // 마감 일정을 원래 날짜 칸이 아니라 "오늘" 칸으로 옮겨서 보여준다 — 일회성 마감
    // 일정만 대상으로 하고(반복 일정은 각 회차가 그 날짜에 고정된 의미가 있어 제외),
    // 오늘 칸에서는 "체크박스 마감내용 D+n" 형태로 D+n을 오른쪽 끝에 표시한다.
    var weekIncludesToday = todayKey >= todayStr(start) && todayKey <= endKeyOfWeek;
    var overdueItems = weekIncludesToday
      ? state.deadlineItems.filter(function (t) { return t.dueDate && t.dueDate < todayKey && !t.done; }).sort(function (a, b) { return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0); })

    var overdueIds = {};

    var columnsHtml = "";
    for (var i = 0; i < 7; i++) {

      var key = todayStr(d);

      var isPastDay = key < todayKey;
      var isFutureDay = key > todayKey;
      var isSelected = key === checklistSelectedDate;

        var done = !!log[t.id];

          '<li class="task week-col-task' + (done ? " done" : "") + '">' +
          "<label>" +
          '<input type="checkbox" data-kind="daily" data-id="' + t.id + '" data-date="' + key + '" ' + (done ? "checked" : "") + " />" +
          '<span class="box"></span>' +
          '<span class="task-label">' + escapeHtml(t.label) + "</span>" +
          "</label>" +
          "</li>"

      var dueTasksHtml = '<ul class="week-col-deadlines">' + (dueTasks.length || (isToday && overdueItems.length)
        ? (dueTasks.map(function (t) {

              '<li class="week-col-deadline-item' + (t.done ? " done" : "") + '" draggable="true" data-deadline-id="' + t.id + '">' +
              '<label class="deadline-item-check">' +
              '<input type="checkbox" data-kind="' + (t.recurring ? "recurring" : "deadline") + '" data-id="' + (t.recurring ? t.occKey : t.id) + '"' + (t.done ? " checked" : "") + ">" +
              '<span class="box" style="--item-color:' + (t.color || DEFAULT_DEADLINE_DOT_COLOR) + '"></span>' +
              '<span class="week-col-deadline-label">' + escapeHtml(t.label) + "</span>" +
              "</label>" +
              "</li>"
            );
          }).join("") +
          (isToday ? overdueItems.map(function (t) {
            return (
              '<li class="week-col-deadline-item week-col-deadline-item-overdue" draggable="true" data-deadline-id="' + t.id + '">' +
              '<label class="deadline-item-check">' +
              '<input type="checkbox" data-kind="deadline" data-id="' + t.id + '">' +
              '<span class="box" style="--item-color:' + (t.color || DEFAULT_DEADLINE_DOT_COLOR) + '"></span>' +
              '<span class="week-col-deadline-label">' + escapeHtml(t.label) + "</span>" +
              "</label>" +
              '<span class="week-col-deadline-dday">' + dDayLabel(t.dueDate) + "</span>" +
              "</li>"

        : "<li class=\"task-empty-hint\">" + tr("등록된 항목이 없어요.") + "</li>") + "</ul>";

      // 없으면 빈 안내 문구를 보여준다).
      var recurringTodayColItems = expandRecurringForDate(key);
      var recurringTodayColHtml =
        "<div class=\"week-col-section-label\">" + tr("오늘의 일정") + "</div>" +
        '<ul class="week-col-deadlines">' + (recurringTodayColItems.length
          ? recurringTodayColItems.map(function (t) {
              return (
                '<li class="week-col-deadline-item' + (t.done ? " done" : "") + '">' +
                '<label class="deadline-item-check">' +
                '<input type="checkbox" data-kind="recurring" data-id="' + t.occKey + '"' + (t.done ? " checked" : "") + '>' +
                '<span class="box" style="--item-color:' + (t.color || DEFAULT_DEADLINE_DOT_COLOR) + '"></span>' +
                '<span class="week-col-deadline-label">' + escapeHtml(t.label) + "</span>" +
                "</label>" +
                "</li>"
              );
            }).join("")
          : "<li class=\"task-empty-hint\">" + tr("등록된 항목이 없어요.") + "</li>") + "</ul>";

  function contrastInk(hex) {
    try {
      var h = hex.replace("#", "");
      var r = parseInt(h.substring(0, 2), 16), g = parseInt(h.substring(2, 4), 16), b = parseInt(h.substring(4, 6), 16);
      var lum = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
      return lum > 0.6 ? "#2B2620" : "#FAF3E7";
    } catch (e) { return "#2B2620"; }
  }

  function hexToRgb(hex) {
    var h = (hex || "").replace("#", "");
    if (h.length === 3) h = h.split("").map(function (c) { return c + c; }).join("");
    return { r: parseInt(h.substring(0, 2), 16), g: parseInt(h.substring(2, 4), 16), b: parseInt(h.substring(4, 6), 16) };
  }
  function rgbToHsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var max = Math.max(r, g, b), min = Math.min(r, g, b);
    var h, s, l = (max + min) / 2;
    if (max === min) { h = 0; s = 0; }
    else {
      var d = max - min;
      s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
      if (max === r) h = (g - b) / d + (g < b ? 6 : 0);
      else if (max === g) h = (b - r) / d + 2;
      else h = (r - g) / d + 4;
      h /= 6;
    }
    return { h: h * 360, s: s * 100, l: l * 100 };
  }
  function hexToHsl(hex) {
    var rgb = hexToRgb(hex);
    return rgbToHsl(rgb.r, rgb.g, rgb.b);
  }
  function hslToHex(h, s, l) {
    h = ((h % 360) + 360) % 360;
    s = Math.max(0, Math.min(100, s)) / 100;
    l = Math.max(0, Math.min(100, l)) / 100;
    var c = (1 - Math.abs(2 * l - 1)) * s;
    var x = c * (1 - Math.abs((h / 60) % 2 - 1));
    var m = l - c / 2;
    var r, g, b;
    if (h < 60) { r = c; g = x; b = 0; }
    else if (h < 120) { r = x; g = c; b = 0; }
    else if (h < 180) { r = 0; g = c; b = x; }
    else if (h < 240) { r = 0; g = x; b = c; }
    else if (h < 300) { r = x; g = 0; b = c; }
    else { r = c; g = 0; b = x; }
    var toHex = function (v) {
      var n = Math.round((v + m) * 255);
      return ("0" + Math.max(0, Math.min(255, n)).toString(16)).slice(-2);
    };
    return "#" + toHex(r) + toHex(g) + toHex(b);
  }
  // 채도/명도를 현재 색상에서 상대적으로 조금씩 올리거나 내릴 때 쓰는 헬퍼.
  function shiftColor(hex, dS, dL) {
    try {
      var hsl = hexToHsl(hex);
      return hslToHex(hsl.h, hsl.s + dS, hsl.l + dL);
    } catch (e) { return hex; }
  }
  // PCCS 톤 기호 중 "bright(비비드에 가까운 밝은 톤)"에 가깝게, 색상(hue)은 유지하고
  // 채도·명도를 해당 톤의 대표값으로 맞춘다.
  function pccsBrightTone(hex) {
    try {
      var hsl = hexToHsl(hex);
      return hslToHex(hsl.h, 76, 60);
    } catch (e) { return hex; }
  }
  // PCCS 톤 기호 중 "soft(부드러운 톤)"에 가깝게, 색상(hue)은 유지하고
  // 채도·명도를 해당 톤의 대표값으로 맞춘다.
  function pccsSoftTone(hex) {
    try {
      var hsl = hexToHsl(hex);
      return hslToHex(hsl.h, 45, 66);
    } catch (e) { return hex; }
  }
  function applyAccent() {
    try {
      document.documentElement.style.setProperty("--accent-gold", state.accent);
      var bg = state.accentTo ? ("linear-gradient(135deg, " + state.accent + ", " + state.accentTo + ")") : state.accent;
      document.documentElement.style.setProperty("--accent-bg", bg);
      // 창 버튼(최소화/최대화/닫기)이 오른쪽에 있으므로, 타이틀바 자체는
      // 왼쪽→오른쪽 그라데이션으로 칠하고, 네이티브 버튼 오버레이 색은
      // 오른쪽 끝(버튼과 맞닿는 색)에 맞춰서 이어지는 것처럼 보이게 한다.
      var edgeColor = state.accentTo || state.accent;
      var titlebarBg = state.accentTo ? ("linear-gradient(to right, " + state.accent + ", " + state.accentTo + ")") : state.accent;
      var ink = contrastInk(edgeColor);
      document.documentElement.style.setProperty("--accent-ink", ink);
      // 그라데이션의 시작색(맨 왼쪽) 기준 대비색 — 타이틀바 텍스트(왼쪽에 위치)와
      // 달력 등 "시작색"을 단색으로 쓰는 요소들은 이 색을 따로 써야 시작색이 어두울 때도
      // 텍스트가 묻히지 않는다.
      var startInk = contrastInk(state.accent);
      document.documentElement.style.setProperty("--accent-ink-solid", startInk);
      var titlebarEl = document.getElementById("app-titlebar");
      if (titlebarEl) {
        titlebarEl.style.background = titlebarBg;
        titlebarEl.style.color = startInk;
      }
      if (window.titlebarAPI && typeof window.titlebarAPI.setOverlay === "function") {
        window.titlebarAPI.setOverlay({ color: edgeColor, symbolColor: ink, height: 45 });
      }
    } catch (e) {}
  }

  // "포트폴리오 도전"(목표 단계) 탭 번호를 계산·표시하는 로직은 포트폴리오 페이지 카드와

  function activeGoalStepIndex() {

  // 사진을 일기/포트폴리오에 저장하기 전에 필요할 때만 축소한다.
  // - 이미 충분히 작은 사진은 재인코딩 없이 원본 그대로 저장해서(화질 손실 방지),
  //   투명 배경(PNG)이나 EXIF 방향 정보도 그대로 유지된다.
  // - 큰 사진만 캔버스로 축소하는데, 이때는 createImageBitmap의
  //   imageOrientation:"from-image" 옵션으로 휴대폰 사진의 회전 정보를 반영하고,
  //   원본이 PNG면 PNG로(투명도 유지), 그 외엔 흰 배경을 먼저 채운 뒤 JPEG로 내보내서
  //   투명 영역이 검게 깨지는 문제를 막는다.
  function readAndCompressImage(file, callback) {
    var MAX_DIM = 1800;
    var isPng = /png/i.test(file.type || "") || /\.png$/i.test(file.name || "");

    function exportFromSource(source, srcW, srcH, originalDataUrl) {
      var w = srcW, h = srcH;
      if (w <= MAX_DIM && h <= MAX_DIM) {
        // 리사이즈가 필요 없으면 재인코딩하지 않고 원본을 그대로 사용한다.
        if (originalDataUrl) { callback(originalDataUrl); return; }
      }
      if (w > MAX_DIM || h > MAX_DIM) {
        if (w > h) { h = Math.round((h * MAX_DIM) / w); w = MAX_DIM; }
        else { w = Math.round((w * MAX_DIM) / h); h = MAX_DIM; }
      }
      try {
        var canvas = document.createElement("canvas");
        canvas.width = w;
        canvas.height = h;
        var ctx = canvas.getContext("2d");
        if (!isPng) {
          // JPEG엔 알파 채널이 없어서, 투명 영역을 흰 배경으로 먼저 채워야
          // 검게 깨져 보이는 걸 막을 수 있다.
          ctx.fillStyle = "#fff";
          ctx.fillRect(0, 0, w, h);
        }
        ctx.drawImage(source, 0, 0, w, h);
        callback(isPng ? canvas.toDataURL("image/png") : canvas.toDataURL("image/jpeg", 0.92));
      } catch (e2) { callback(originalDataUrl || null); }
    }

    function viaImageElement(originalDataUrl) {
      try {
        var img = new Image();
        img.onload = function () { exportFromSource(img, img.width, img.height, originalDataUrl); };
        img.onerror = function () { callback(null); };
        img.src = originalDataUrl;
      } catch (e2) { callback(null); }
    }

    try {
      var reader = new FileReader();
      reader.onload = function (e) {
        var originalDataUrl = e.target.result;
        if (typeof createImageBitmap === "function") {
          createImageBitmap(file, { imageOrientation: "from-image" }).then(function (bitmap) {
            exportFromSource(bitmap, bitmap.width, bitmap.height, originalDataUrl);
          }).catch(function () { viaImageElement(originalDataUrl); });
        } else {
          viaImageElement(originalDataUrl);
        }
      };
      reader.onerror = function () { callback(null); };
      reader.readAsDataURL(file);
    } catch (e) { callback(null); }
  }

  // 클립보드에 복사해둔 이미지를 그림 일기에 바로 붙여넣는다. 업로드 버튼과 같은
  // readAndCompressImage 압축 로직을 그대로 재사용한다.
  function pasteDiaryImageFromClipboard(date) {
    if (!navigator.clipboard || !navigator.clipboard.read) {
      setDiarySaveStatus(tr("이 환경에서는 붙여넣기를 지원하지 않아요"));
      return;
    }
    navigator.clipboard.read().then(function (items) {
      var imageType = null;
      var imageItem = null;
      items.some(function (item) {
        var t = item.types.find(function (ty) { return ty.indexOf("image/") === 0; });
        if (t) { imageType = t; imageItem = item; return true; }
        return false;
      });
      if (!imageItem) {
        setDiarySaveStatus(tr("클립보드에 이미지가 없어요"));
        return;
      }
      imageItem.getType(imageType).then(function (blob) {
        readAndCompressImage(blob, function (dataUrl) {
          if (!dataUrl) { setDiarySaveStatus(tr("이미지를 붙여넣지 못했어요")); return; }
          if (!state.diary[date]) state.diary[date] = { text: "", images: [] };
          if (!state.diary[date].images) state.diary[date].images = [];
          state.diary[date].images.push(dataUrl);
          render();
          saveState();
        });
      });
    }).catch(function () {
      setDiarySaveStatus(tr("클립보드 접근 권한이 필요해요"));
    });
  }

  function renderImagesPanel(date, target, isEditing) {
    var entry = state.diary[date] || { images: [] };

    if (idx >= images.length) idx = images.length ? images.length - 1 : 0;

  // 일기장 오른쪽 날개 카드(오늘의 일정/마감 일정/오늘의 할 일)는 순서를 드래그로

  function diarySidebarCardHtml(id) {
    if (id === "recurringToday") return renderRecurringTodayCard(diarySelectedDate);
    // 지금 보고 있는 날짜(diarySelectedDate) 기준 마감만 보여준다 — 다른 날짜의 마감이
    // 섞이면 헷갈리므로 dateFilter를 넘겨서 그 날짜만 걸러서 보여준다.

  function renderDiaryPageContent() {

  function shiftDiaryDate(target, delta) {
    var d2 = new Date(diarySelectedDate + "T00:00:00");

    diarySelectedDate = clampToToday(todayStr(d2));
    render();

  function renderTodayWidget() {
    var target = diarySelectedDate;
    var isToday = target === todayStr();
    var log = state.dailyLog[target] || {};

      var done = !!log[t.id];

  function formatShortDate(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    return (d.getMonth() + 1) + "/" + d.getDate();
  }

  function dDayLabel(dateStr) {
    var d = new Date(dateStr + "T00:00:00");
    var t = new Date(todayStr() + "T00:00:00");
    var diff = Math.round((d - t) / 86400000);
    if (diff === 0) return "D-DAY";
    if (diff > 0) return "D-" + diff;
    return "D+" + Math.abs(diff);
  }

  function deadlineDateDdayHtml(dueDate) {
    var dday = dDayLabel(dueDate);
    // D-n(남음)·D-DAY(오늘)·D+n(지남)이 색으로 뚜렷이 구분되게 한다. 그냥 두면 D-n과
    // D+n이 똑같은 기본 칩 색이라 헷갈린다. D-n 중에서도 D-3 이하(임박)는 D-4 이상(여유)과
    // 또 다르게 표시해서, 얼마 안 남았다는 게 눈에 더 잘 띄게 한다.
    var ddayClass = "chip-btn chip-btn-set deadline-dday-badge";
    if (dday === "D-DAY") {
      ddayClass += " dday-today";
    } else if (dday.charAt(1) === "+") {
      ddayClass += " dday-overdue";
    } else {
      var daysLeft = parseInt(dday.slice(2), 10);
      ddayClass += daysLeft <= 3 ? " dday-urgent" : " dday-upcoming";
    }
    return '<span class="' + ddayClass + '">' + dday + "</span>";
  }
  // 체크(완료)된 항목은 디데이가 계속 흘러가며 바뀌지 않도록, "완료" 대신 마감 날짜를
  // 고정해서 보여준다.
  function deadlineStatusBadgeHtml(t) {
    if (t.done) {
      return t.dueDate
        ? ('<span class="deadline-done-badge"><span>' + t.dueDate.slice(5).replace("-", ".") + "</span></span>")
        : ('<span class="deadline-done-badge"><span>' + tr("완료") + "</span></span>");
    }
    return t.dueDate ? deadlineDateDdayHtml(t.dueDate) : "<span class=\"chip-btn deadline-item-date-badge\">" + tr("날짜 미정") + "</span>";
  }
  // 마감이 가까운 순으로 정렬한다: 오늘 포함 다가오는 일정(D-0, D-1, ...)을 먼저,
  // 그다음 이미 지난(D+) 일정, 날짜 미정은 맨 뒤로. 완료된 항목은 맨 아래로 가라앉힌다.
  function sortedDeadlineItems(list) {
    var today = todayStr();
    function groupKey(t) {
      if (!t.dueDate) return 2;
      return t.dueDate >= today ? 0 : 1;
    }
    return list.slice().sort(function (a, b) {
      if (!!a.done !== !!b.done) return a.done ? 1 : -1;
      var ka = groupKey(a), kb = groupKey(b);
      if (ka !== kb) return ka - kb;
      if (ka === 2) return 0;
      return a.dueDate < b.dueDate ? -1 : (a.dueDate > b.dueDate ? 1 : 0);
    });
  }

  function deadlineColorSwatchesHtml(selectedColor, targetId) {

  // 커스텀 추가용 "+" 칩은 없다.

  // 라벨 없이 칩만 인라인으로 보여준다(팝오버로 여는 방식 아님).
  function deadlineColorControlHtml(selectedColor, targetId) {

        'style="background:' + hex + "\" aria-label=\"" + tr("색상 선택") + "\" title=\"" + tr("마감 점 색상") + "\"></button>"
      );
    }).join("");
    return '<div class="recurring-color-swatch-row deadline-inline-swatches">' + swatchesHtml + "</div>";
  }

  // 규칙적인 일정 색상칩: "색상변경" 라벨 옆에 부드러운("soft") 파스텔 팔레트 칩들과
  // 커스텀 색상을 추가하는 "+" 칩을 한 줄에 항상 펼쳐서 보여준다(클릭해서 여는 팝오버 아님).

  // 특정 날짜만 빼고 싶을 때(공휴일 등) 쓰는 제외 날짜 목록 + 추가 폼. 메모는 선택
  // 사항이라, 메모를 안 적어도 날짜만으로 제외를 걸 수 있어야 한다. 목록/추가 폼은
  // 아코디언처럼 접었다 펼 수 있어서, 평소엔 헤더 한 줄만 차지한다.
  function recurringExceptionsSectionHtml(s, periodStart, periodEnd) {
    var exceptions = (s.exceptions || []).slice().sort(function (a, b) { return a.date < b.date ? -1 : (a.date > b.date ? 1 : 0); });
    // 처음 편집을 열 때는 이미 등록된 제외 날짜가 있으면 펼쳐서 보여주고, 없으면 접어서
    // 시작한다. 이후엔 사용자가 토글한 상태를 그대로 따른다.
    var isOpen = Object.prototype.hasOwnProperty.call(openRecurringExceptionIds, s.id)
      ? !!openRecurringExceptionIds[s.id]
      : exceptions.length > 0;
    var headerHtml =
      '<button type="button" class="recurring-exceptions-toggle' + (isOpen ? " recurring-exceptions-toggle-open" : "") + '" data-action="toggle-recurring-exceptions" data-id="' + s.id + '" aria-expanded="' + (isOpen ? "true" : "false") + '">' +
      '<span class="recurring-exceptions-toggle-chevron" aria-hidden="true">' + ICON_CHEVRON_DOWN + "</span>" +
      "<span class=\"recurring-add-row-label\">" + tr("제외 날짜") + "</span>" +
      "</button>";
    if (!isOpen) {
      return '<div class="recurring-add-row recurring-exceptions-section recurring-exceptions-section-collapsed">' + headerHtml + "</div>";
    }
    var liveExDate = liveVal('[data-role="recurring-exception-add-date"][data-id="' + s.id + '"]', "");
    var liveExNote = liveVal('[data-role="recurring-exception-add-note"][data-id="' + s.id + '"]', "");
    // 위에서 설정한 반복 기간(있으면) 안에서만 제외 날짜를 고를 수 있게, 날짜 입력창에
    // min/max로 그 범위를 건다. 기간을 비워두면(무기한 반복) 제한 없이 아무 날짜나
    // 고를 수 있다.
    var exDateRangeAttrs = (periodStart ? ' min="' + periodStart + '"' : "") + (periodEnd ? ' max="' + periodEnd + '"' : "");
    var listHtml = exceptions.length
      ? exceptions.map(function (ex) {
          return (
            '<div class="recurring-exception-row">' +
            '<span class="recurring-exception-date">' + ex.date + "</span>" +
            (ex.note ? '<span class="recurring-exception-note">' + escapeHtml(ex.note) + "</span>" : "") +
            '<button type="button" class="icon-btn icon-btn-danger" data-action="delete-recurring-exception" data-id="' + s.id + '" data-date="' + ex.date + "\" aria-label=\"" + tr("제외 날짜 삭제") + "\">" + ICON_X_LINE + "</button>" +
            "</div>"
          );
        }).join("")
      : '<p class="task-empty-hint recurring-exceptions-empty">' + tr("등록된 제외 날짜가 없어요.") + "</p>";
    return (
      '<div class="recurring-add-row recurring-exceptions-section">' +
      headerHtml +
      '<div class="recurring-exceptions-list">' + listHtml + "</div>" +
      '<div class="recurring-exceptions-add-row">' +
      '<input type="date" class="deadline-item-add-date" data-role="recurring-exception-add-date" data-id="' + s.id + '" value="' + liveExDate + '"' + exDateRangeAttrs + '>' +
      '<input type="text" class="task-add-input" data-role="recurring-exception-add-note" data-id="' + s.id + '" value="' + escapeHtml(liveExNote) + "\" placeholder=\"" + tr("메모(선택)") + "\">" +
      '<button type="button" class="chip-btn" data-action="add-recurring-exception" data-id="' + s.id + '">+ ' + tr("추가") + "</button>" +
      "</div>" +
      "</div>"
    );
  }

  function toggleRecurringExceptionsOpen(id, currentlyOpen) {
    openRecurringExceptionIds[id] = !currentlyOpen;
    render();
  }

  function commitAddRecurringException(id) {
    try {
      // "add"는 아직 저장되지 않은 신규 추가 폼(state.recurringSchedules에 없음)이라,
      // 그 경우엔 pendingRecurringExceptions에 담아뒀다가 추가 버튼을 누를 때 새
      // 일정에 옮겨 담는다.
      var isAddForm = id === "add";
      var s = isAddForm ? null : (state.recurringSchedules || []).find(function (x) { return x.id === id; });
      if (!isAddForm && !s) return;
      var dateEl = document.querySelector('[data-role="recurring-exception-add-date"][data-id="' + id + '"]');
      var noteEl = document.querySelector('[data-role="recurring-exception-add-note"][data-id="' + id + '"]');
      var dateVal = dateEl ? dateEl.value : "";
      var noteVal = noteEl ? noteEl.value.trim() : "";
      // 메모 없이도(빈 문자열) 제외 날짜는 등록할 수 있어야 한다 — 필요한 건 날짜뿐이다.
      if (!dateVal) return;
      // 입력창의 min/max로 대부분 막히지만, 혹시 모를 우회 입력에 대비해 반복 기간
      // 범위 밖 날짜는 여기서도 한 번 더 걸러낸다.
      if (dateEl && dateEl.min && dateVal < dateEl.min) return;
      if (dateEl && dateEl.max && dateVal > dateEl.max) return;
      var exceptionsList = isAddForm ? pendingRecurringExceptions : s.exceptions;
      if (!Array.isArray(exceptionsList)) exceptionsList = isAddForm ? pendingRecurringExceptions : (s.exceptions = []);
      var existing = exceptionsList.find(function (ex) { return ex.date === dateVal; });
      if (existing) existing.note = noteVal;
      else exceptionsList.push({ date: dateVal, note: noteVal });
      if (dateEl) dateEl.value = "";
      if (noteEl) noteEl.value = "";
      if (!isAddForm) saveState();
    } catch (e) {}
    render();
  }

  function deleteRecurringException(id, date) {
    if (id === "add") {
      pendingRecurringExceptions = pendingRecurringExceptions.filter(function (ex) { return ex.date !== date; });
      render();
      return;
    }
    var s = (state.recurringSchedules || []).find(function (x) { return x.id === id; });
    if (!s || !Array.isArray(s.exceptions)) return;
    s.exceptions = s.exceptions.filter(function (ex) { return ex.date !== date; });
    saveState();
    render();
  }

    return (
      '<span class="recurring-add-row-label">' + tr("알림") + '</span>' +
      '<input type="time" class="task-reminder-input" data-role="recurring-add-reminder" value="' + (pendingRecurringReminderTime || "") + '" aria-label="' + tr("알림 시간") + '">'
    );
  }

  function recurringReminderEditControlHtml(s) {

  function commitAddRecurringSchedule() {
    try {
      var startEl = document.querySelector('[data-role="recurring-add-start"]');
      var endEl = document.querySelector('[data-role="recurring-add-end"]');
      var labelEl = document.querySelector('[data-role="recurring-add-label"]');
      var startVal = startEl ? startEl.value : "";
      var endVal = endEl ? endEl.value : "";
      var labelVal = labelEl ? labelEl.value.trim() : "";
      // 기간 날짜를 둘 다 채운 경우에만 기간이 있는 일정으로 저장하고, 비워두면
      // 종료일 없는(항상 반복되는) 일정으로 저장한다.
      var hasPeriod = !!(startVal && endVal);
      // 시작일이 종료일보다 늦으면 두 값을 서로 바꿔서 저장한다.
      if (hasPeriod && startVal > endVal) {
        var swapTmp = startVal;
        startVal = endVal;
        endVal = swapTmp;
      }
      if (pendingRecurringWeekdays.length) {
        var entries = pendingRecurringWeekdays.slice().sort().map(function (wd) {
          return { weekday: wd, label: labelVal };
        });
        state.recurringSchedules = (state.recurringSchedules || []).concat([{
          id: "recur-" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
          startDate: hasPeriod ? startVal : null, endDate: hasPeriod ? endVal : null,
          entries: entries, color: pendingRecurringAddColor || DEFAULT_RECURRING_DOT_COLOR,
          reminderTime: pendingRecurringReminderTime || null,
          exceptions: pendingRecurringExceptions.slice()
        }]);
        if (labelEl) labelEl.value = "";
        if (startEl) startEl.value = "";
        if (endEl) endEl.value = "";
        pendingRecurringWeekdays = [];
        pendingRecurringReminderTime = "";
        editingRecurringReminderAdd = false;
        pendingRecurringExceptions = [];
        openRecurringExceptionIds["add"] = false;
        pendingRecurringAddColor = DEFAULT_RECURRING_DOT_COLOR;
        recurringColorPickerOpenId = null;
        saveState();
      }
      render();
    } catch (e) {}
  }
